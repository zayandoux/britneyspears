<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor do catálogo — It's Britney, App!</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #070913;
            --surface: #101421;
            --surface-2: #171c2d;
            --surface-3: #20263a;
            --text: #f7f7fb;
            --muted: #aeb5c8;
            --line: #30374d;
            --pink: #ff3896;
            --pink-soft: rgba(255, 56, 150, .14);
            --blue: #30b9ff;
            --green: #4bd59a;
            --red: #ff6577;
            --yellow: #ffc857;
            --radius: 16px;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% -10%, rgba(255, 56, 150, .16), transparent 32rem),
                radial-gradient(circle at 95% 10%, rgba(48, 185, 255, .11), transparent 30rem),
                var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button, input, textarea, select { font: inherit; }
        button { cursor: pointer; }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 18px 24px;
            border-bottom: 1px solid var(--line);
            background: rgba(7, 9, 19, .92);
            backdrop-filter: blur(18px);
        }

        .brand { min-width: 220px; }
        .brand h1 { margin: 0; font-size: 21px; font-weight: 700; }
        .brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

        .top-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 9px; }
        .button {
            min-height: 42px;
            padding: 9px 14px;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: var(--surface-2);
            color: var(--text);
            font-weight: 650;
        }
        .button:hover { border-color: #59627e; background: var(--surface-3); }
        .button.primary { border-color: var(--pink); background: var(--pink); color: white; }
        .button.primary:hover { background: #f52287; }
        .button.danger { color: #ffdce2; border-color: rgba(255, 101, 119, .55); background: rgba(255, 101, 119, .1); }
        .button.small { min-height: 34px; padding: 6px 10px; font-size: 13px; border-radius: 9px; }
        .button.icon { min-width: 34px; padding: 6px 8px; }

        .status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: 45px;
            padding: 10px 24px;
            color: var(--muted);
            border-bottom: 1px solid var(--line);
            background: rgba(16, 20, 33, .75);
            font-size: 14px;
        }
        .status.success { color: var(--green); }
        .status.error { color: #ff9aa6; }
        .dirty { color: var(--yellow); font-weight: 700; white-space: nowrap; }

        .layout {
            display: grid;
            grid-template-columns: 360px minmax(0, 1fr);
            min-height: calc(100vh - 115px);
        }

        .sidebar {
            padding: 20px;
            border-right: 1px solid var(--line);
            background: rgba(10, 13, 24, .72);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }
        .summary-item { padding: 11px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
        .summary-item strong { display: block; font-size: 21px; }
        .summary-item span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }

        .sections { display: grid; gap: 6px; margin-bottom: 15px; }
        .section-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-height: 42px;
            padding: 9px 12px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            text-align: left;
        }
        .section-button:hover { color: var(--text); background: var(--surface-2); }
        .section-button.active { color: white; border-color: rgba(255, 56, 150, .45); background: var(--pink-soft); }
        .section-count { min-width: 28px; padding: 2px 7px; border-radius: 999px; background: var(--surface-3); text-align: center; font-size: 12px; }
        .section-group-label { margin: 9px 7px 1px; color: var(--pink); font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
        .section-group { display: grid; gap: 6px; }

        .search { margin: 14px 0 10px; }
        .search input { width: 100%; }

        .list-toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
        .list-toolbar .button { flex: 1; }
        .list-hint { display: none; margin: 0 2px 10px; color: var(--muted); font-size: 12px; line-height: 1.45; }
        .list-hint.visible { display: block; }
        .item-list { display: grid; gap: 8px; }
        .list-item {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface);
            color: var(--text);
            text-align: left;
        }
        .list-item:hover { border-color: #59627e; }
        .list-item.active { border-color: var(--pink); background: var(--pink-soft); }
        .list-item[draggable="true"] { cursor: grab; }
        .list-item[draggable="true"]:active { cursor: grabbing; }
        .list-item.dragging { opacity: .35; }
        .list-item.drag-over { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(48, 185, 255, .16); }
        .list-item strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .list-item span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .empty-list { padding: 18px 10px; color: var(--muted); text-align: center; }

        .workspace { min-width: 0; padding: 28px; }
        .editor-shell { max-width: 1050px; margin: 0 auto; }
        .editor-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 22px;
        }
        .editor-header h2 { margin: 0; font-size: 26px; }
        .editor-header p { margin: 6px 0 0; color: var(--muted); }
        .editor-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

        .panel {
            margin-bottom: 18px;
            padding: 20px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: rgba(16, 20, 33, .9);
        }
        .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
        .panel-heading h3 { margin: 0; font-size: 18px; }
        .panel-heading p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

        .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
        .field-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .field { min-width: 0; }
        .field.full { grid-column: 1 / -1; }
        .field label { display: block; margin: 0 0 7px; color: #dce1ee; font-size: 13px; font-weight: 650; }
        .field small { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; }
        input, textarea, select {
            width: 100%;
            min-height: 43px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            outline: none;
            background: #0b0f1b;
            color: var(--text);
        }
        textarea { min-height: 92px; resize: vertical; }
        input:focus, textarea:focus, select:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255, 56, 150, .12); }
        .path-input { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }

        details.collection-item { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; background: #0b0f1b; overflow: hidden; }
        details.collection-item[open] { border-color: #4a536f; }
        details.collection-item > summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 49px;
            padding: 10px 12px;
            cursor: pointer;
            list-style: none;
        }
        details.collection-item > summary::-webkit-details-marker { display: none; }
        .summary-copy { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
        .row-actions { display: flex; gap: 6px; flex: 0 0 auto; }
        .collection-body { padding: 15px; border-top: 1px solid var(--line); }
        .collection-empty { padding: 12px 0; color: var(--muted); }

        .validation-list { margin: 0; padding-left: 20px; }
        .validation-list li { margin: 7px 0; }
        .validation-ok { color: var(--green); }
        .validation-warning { color: var(--yellow); }
        .validation-error { color: #ff9aa6; }

        dialog { width: min(940px, calc(100% - 32px)); padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); }
        dialog::backdrop { background: rgba(0, 0, 0, .72); backdrop-filter: blur(4px); }
        .dialog-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 20px; border-bottom: 1px solid var(--line); }
        .dialog-header h2 { margin: 0; font-size: 20px; }
        .dialog-body { padding: 20px; }
        #jsonPreview { min-height: 58vh; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; white-space: pre; }

        .welcome { max-width: 760px; margin: 60px auto; padding: 34px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); text-align: center; }
        .welcome h2 { margin-top: 0; }
        .welcome p { color: var(--muted); line-height: 1.6; }
        .welcome-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }

        @media (max-width: 900px) {
            .topbar { align-items: flex-start; flex-direction: column; }
            .top-actions { justify-content: flex-start; }
            .layout { grid-template-columns: 1fr; }
            .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
            .sections { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .item-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 620px) {
            .topbar, .status, .sidebar, .workspace { padding-left: 14px; padding-right: 14px; }
            .top-actions, .top-actions .button { width: 100%; }
            .field-grid, .field-grid.three { grid-template-columns: 1fr; }
            .field.full { grid-column: auto; }
            .item-list { grid-template-columns: 1fr; }
            .editor-header { flex-direction: column; }
            .editor-actions { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <h1>Editor do catálogo</h1>
            <p>It's Britney, App! + site</p>
        </div>
        <div class="top-actions">
            <button class="button" id="loadSiteButton" type="button">Carregar catalogo.json</button>
            <button class="button" id="openFileButton" type="button">Abrir arquivo JSON</button>
            <button class="button" id="previewButton" type="button">Visualizar JSON</button>
            <button class="button" id="validateButton" type="button">Validar</button>
            <button class="button primary" id="downloadButton" type="button">Baixar catalogo.json</button>
            <input id="jsonFileInput" type="file" accept="application/json,.json" hidden>
        </div>
    </header>

    <div class="status" id="statusBar" aria-live="polite">
        <span id="statusText">Carregando o catálogo publicado no GitHub Pages…</span>
        <span class="dirty" id="dirtyText"></span>
    </div>

    <main class="layout">
        <aside class="sidebar">
            <div class="summary-grid" aria-label="Resumo do catálogo">
                <div class="summary-item"><strong id="albumCount">0</strong><span>álbuns</span></div>
                <div class="summary-item"><strong id="trackCount">0</strong><span>faixas</span></div>
                <div class="summary-item"><strong id="videoCount">0</strong><span>vídeos</span></div>
            </div>

            <nav class="sections" aria-label="Categorias">
                <button class="section-button" type="button" data-section="settings"><span>Configurações</span></button>
                <div class="section-group-label">Músicas</div>
                <div class="section-group" id="musicSectionButtons"></div>
                <div class="section-group-label">Vídeos</div>
                <button class="section-button" type="button" data-section="clips"><span>Clipes</span><span class="section-count">0</span></button>
                <button class="section-button" type="button" data-section="shows"><span>Shows</span><span class="section-count">0</span></button>
                <div class="section-group-label">Extras</div>
                <div class="section-group" id="extraSectionButtons"></div>
            </nav>

            <div class="search">
                <label for="searchInput" style="display:none">Pesquisar conteúdo</label>
                <input id="searchInput" type="search" placeholder="Pesquisar nesta categoria">
            </div>
            <div class="list-toolbar">
                <button class="button small" id="addItemButton" type="button">Adicionar conteúdo</button>
            </div>
            <p class="list-hint" id="listHint">Segure e arraste os itens para mudar a ordem do catálogo.</p>
            <div class="item-list" id="itemList"></div>
        </aside>

        <section class="workspace" id="workspace"></section>
    </main>

    <dialog id="previewDialog">
        <div class="dialog-header">
            <h2>Prévia do catalogo.json</h2>
            <button class="button small" id="closePreviewButton" type="button">Fechar</button>
        </div>
        <div class="dialog-body">
            <textarea id="jsonPreview" readonly spellcheck="false"></textarea>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px">
                <button class="button" id="copyPreviewButton" type="button">Copiar JSON</button>
                <button class="button primary" id="downloadPreviewButton" type="button">Baixar</button>
            </div>
        </div>
    </dialog>

    <script>
        let sectionDefinitions = {
            settings: { label: 'Configurações', kind: 'settings' },
            clips: { label: 'Clipes', kind: 'media', storage: 'clips' },
            shows: { label: 'Shows', kind: 'media', storage: 'shows' }
        };
        const CATALOG_SOURCE_URL = 'https://zayandoux.github.io/britneyspears/catalogo.json';

        let catalog = createEmptyCatalog();
        let currentSection = 'music:main';
        let selectedItem = null;
        let dirty = false;
        let draggedListItem = null;
        let draggedListSection = null;

        const workspace = document.getElementById('workspace');
        const itemList = document.getElementById('itemList');
        const searchInput = document.getElementById('searchInput');
        const addItemButton = document.getElementById('addItemButton');
        const listHint = document.getElementById('listHint');
        const statusBar = document.getElementById('statusBar');
        const statusText = document.getElementById('statusText');
        const dirtyText = document.getElementById('dirtyText');
        const fileInput = document.getElementById('jsonFileInput');
        const previewDialog = document.getElementById('previewDialog');
        const jsonPreview = document.getElementById('jsonPreview');

        function createEmptyCatalog() {
            return {
                schemaVersion: 5,
                title: 'Discografia Britney Spears',
                artist: 'Britney Spears',
                assetBaseUrl: 'https://zayandoux.github.io/britneyspears/',
                assetUrlRule: 'O aplicativo deve juntar assetBaseUrl com cada campo terminado em Path.',
                musicCategories: defaultMusicCategories(),
                extraCategories: defaultExtraCategories(),
                albums: [],
                clips: [],
                shows: [],
                extras: []
            };
        }

        function defaultMusicCategories() {
            return [
                { id: 'main', title: 'Álbuns de Estúdio', iconPath: '' },
                { id: 'compilation', title: 'Compilações Oficiais', iconPath: '' },
                { id: 'remixes', title: 'Álbuns Remixes', iconPath: '' },
                { id: 'unreleased', title: 'Músicas Não Lançadas', iconPath: '' }
            ];
        }

        function defaultExtraCategories() {
            return [
                { id: 'documentarios', title: 'Documentários', iconPath: '', continueWatching: true, autoAdvance: false },
                { id: 'apresentacoes-tv', title: 'Apresentações na TV', iconPath: '', continueWatching: false, autoAdvance: false },
                { id: 'comerciais', title: 'Comerciais', iconPath: '', continueWatching: false, autoAdvance: true },
                { id: 'outros', title: 'Outros', iconPath: '', continueWatching: true, autoAdvance: false }
            ];
        }

        function flattenAlbumVersions(albums) {
            const used = new Set(albums.map(album => String(album.id || '')));
            const result = [];
            albums.forEach(album => {
                const versions = Array.isArray(album.versions) ? album.versions : [];
                if (!versions.length) {
                    const cleanAlbum = { ...album };
                    delete cleanAlbum.versions;
                    result.push(cleanAlbum);
                    return;
                }
                versions.forEach((version, index) => {
                    let id = index === 0 ? String(album.id || slugify(version.title)) : `${album.id || 'album'}-${slugify(version.title || `edicao-${index + 1}`)}`;
                    const baseId = id;
                    let suffix = 2;
                    while (result.some(item => item.id === id) || (index > 0 && used.has(id))) id = `${baseId}-${suffix++}`;
                    const standalone = { ...album, ...version, id };
                    standalone.artist = version.artist || album.artist || 'Britney Spears';
                    standalone.category = album.category || 'main';
                    standalone.backgroundPath = version.backgroundPath || album.backgroundPath || '';
                    standalone.tracks = Array.isArray(version.tracks) ? version.tracks : [];
                    delete standalone.versions;
                    result.push(standalone);
                });
            });
            return result;
        }

        function normalizeCatalog(value) {
            if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('O conteúdo não é um objeto JSON válido.');
            if (!Array.isArray(value.albums)) value.albums = [];
            value.albums = flattenAlbumVersions(value.albums);
            if (!Array.isArray(value.musicCategories) || !value.musicCategories.length) {
                value.musicCategories = defaultMusicCategories();
            }
            if (!Array.isArray(value.extraCategories) || !value.extraCategories.length) {
                value.extraCategories = defaultExtraCategories();
            }
            if (!Array.isArray(value.clips)) value.clips = [];
            if (!Array.isArray(value.shows)) value.shows = [];
            if (!Array.isArray(value.extras)) value.extras = [];
            value.schemaVersion = 5;
            value.albums.forEach(album => {
                album.category = normalizedMusicCategoryId(album.category);
                if (!value.musicCategories.some(category => category.id === album.category)) {
                    value.musicCategories.push({ id: album.category, title: album.category.replace(/[-_]/g, ' '), iconPath: '' });
                }
            });
            value.extras.forEach(item => {
                item.category = String(item.category || 'outros').trim().toLowerCase() || 'outros';
                if (!value.extraCategories.some(category => category.id === item.category)) {
                    value.extraCategories.push({ id: item.category, title: item.category.replace(/[-_]/g, ' '), iconPath: '', continueWatching: true, autoAdvance: false });
                }
            });
            const normalizeMediaSubtitles = item => {
                if (!Array.isArray(item.subtitles)) {
                    item.subtitles = item.subtitlePath ? [{
                        label: item.subtitleLabel || 'Português',
                        language: item.subtitleLanguage || 'pt-BR',
                        subtitlePath: item.subtitlePath
                    }] : [];
                }
                delete item.subtitlePath;
                delete item.subtitleLabel;
                delete item.subtitleLanguage;
                delete item.subtitleUrl;
            };
            ['clips', 'shows', 'extras'].forEach(section => {
                value[section].forEach(item => {
                    normalizeMediaSubtitles(item);
                    if (section === 'shows') {
                        if (!Array.isArray(item.variants)) item.variants = [];
                        item.variants.forEach(normalizeMediaSubtitles);
                    }
                });
            });
            if (!value.title) value.title = 'Discografia Britney Spears';
            if (!value.artist) value.artist = 'Britney Spears';
            if (!value.assetBaseUrl) value.assetBaseUrl = 'https://zayandoux.github.io/britneyspears/';
            return value;
        }

        function albumCategory(album) {
            return normalizedMusicCategoryId(album.category);
        }

        function normalizedMusicCategoryId(value) {
            const category = String(value || 'main').trim().toLowerCase();
            if (category === 'official-compilations') return 'compilation';
            if (category === 'albums-remixes') return 'remixes';
            if (category === 'unreleased-music' || category === 'musicas-nao-lancadas') return 'unreleased';
            return category || 'main';
        }

        function musicSectionKey(id) { return `music:${id}`; }
        function extraSectionKey(id) { return `extra:${id}`; }

        function rebuildSectionDefinitions() {
            sectionDefinitions = {
                settings: { label: 'Configurações', kind: 'settings' },
                clips: { label: 'Clipes', kind: 'media', storage: 'clips' },
                shows: { label: 'Shows', kind: 'media', storage: 'shows' }
            };
            catalog.musicCategories.forEach(category => {
                sectionDefinitions[musicSectionKey(category.id)] = {
                    label: category.title || category.id,
                    kind: 'album', category: category.id, storage: 'albums'
                };
            });
            catalog.extraCategories.forEach(category => {
                sectionDefinitions[extraSectionKey(category.id)] = {
                    label: category.title || category.id,
                    kind: 'media', category: category.id, storage: 'extras'
                };
            });
        }

        function itemsForSection(section = currentSection) {
            if (section === 'settings') return [];
            const definition = sectionDefinitions[section];
            if (!definition) return [];
            if (definition.storage === 'clips') return catalog.clips;
            if (definition.storage === 'shows') return catalog.shows;
            if (definition.storage === 'extras') {
                return catalog.extras.filter(item => String(item.category || 'outros') === definition.category);
            }
            return catalog.albums.filter(album => albumCategory(album) === definition.category);
        }

        function storageForSection(section = currentSection) {
            const definition = sectionDefinitions[section];
            return definition && definition.storage ? catalog[definition.storage] : [];
        }

        function countAlbumTracks(album) {
            return Array.isArray(album.tracks) ? album.tracks.length : 0;
        }

        function setStatus(message, kind = '') {
            statusText.textContent = message;
            statusBar.className = `status ${kind}`.trim();
        }

        function markDirty() {
            dirty = true;
            dirtyText.textContent = 'Alterações ainda não baixadas';
        }

        function clearDirty() {
            dirty = false;
            dirtyText.textContent = '';
        }

        function escapeText(value) {
            return String(value == null ? '' : value);
        }

        function slugify(value) {
            return String(value || 'novo-item')
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'novo-item';
        }

        function uniqueId(base) {
            const used = new Set([
                ...catalog.albums.map(item => item.id),
                ...catalog.clips.map(item => item.id),
                ...catalog.shows.map(item => item.id),
                ...catalog.shows.flatMap(item => (item.variants || []).map(variant => variant.id)),
                ...catalog.extras.map(item => item.id)
            ]);
            let id = slugify(base);
            let suffix = 2;
            while (used.has(id)) id = `${slugify(base)}-${suffix++}`;
            return id;
        }

        function normalizePath(value) {
            return String(value || '').trim().replace(/\\/g, '/').replace(/ /g, '%20');
        }

        function normalizedExportCatalog() {
            const copy = JSON.parse(JSON.stringify(catalog));
            copy.schemaVersion = 5;
            copy.albums.forEach(album => delete album.versions);
            const visit = node => {
                if (Array.isArray(node)) return node.forEach(visit);
                if (!node || typeof node !== 'object') return;
                Object.keys(node).forEach(key => {
                    if (key.endsWith('Path') && typeof node[key] === 'string') node[key] = normalizePath(node[key]);
                    else visit(node[key]);
                });
            };
            visit(copy);
            return copy;
        }

        function applyLoadedCatalog(value, sourceLabel) {
            catalog = normalizeCatalog(value);
            rebuildSectionDefinitions();
            currentSection = musicSectionKey(catalog.musicCategories[0].id);
            selectedItem = itemsForSection()[0] || null;
            searchInput.value = '';
            clearDirty();
            renderAll();
            setStatus(`${sourceLabel} — ${catalog.albums.length} álbuns, ${catalog.clips.length} clipe(s), ${catalog.shows.length} show(s) e ${catalog.extras.length} extra(s).`, 'success');
        }

        async function loadCatalogFromSite(force = false) {
            if (force && dirty && !window.confirm('Descartar as alterações atuais e carregar o catalogo.json novamente?')) return;
            setStatus('Carregando catalogo.json…');
            try {
                const separator = CATALOG_SOURCE_URL.includes('?') ? '&' : '?';
                const response = await fetch(`${CATALOG_SOURCE_URL}${separator}v=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                applyLoadedCatalog(await response.json(), 'Catálogo carregado');
            } catch (error) {
                setStatus('Não foi possível carregar automaticamente. Clique em “Abrir arquivo JSON”.', 'error');
                renderWelcome();
            }
        }

        function loadCatalogFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    applyLoadedCatalog(JSON.parse(reader.result), `Arquivo ${file.name} carregado`);
                } catch (error) {
                    setStatus(`Erro ao abrir ${file.name}: ${error.message}`, 'error');
                }
            };
            reader.onerror = () => setStatus('Não foi possível ler o arquivo selecionado.', 'error');
            reader.readAsText(file, 'UTF-8');
        }

        function enableMediaListDrag(button, item) {
            button.draggable = true;
            button.title = 'Segure e arraste para mudar a ordem';
            button.addEventListener('dragstart', event => {
                draggedListItem = item;
                draggedListSection = currentSection;
                button.classList.add('dragging');
                event.dataTransfer.effectAllowed = 'move';
                event.dataTransfer.setData('text/plain', item.id || item.title || 'media-item');
            });
            button.addEventListener('dragover', event => {
                if (!draggedListItem || draggedListSection !== currentSection || draggedListItem === item) return;
                event.preventDefault();
                event.stopPropagation();
                event.dataTransfer.dropEffect = 'move';
                button.classList.add('drag-over');
            });
            button.addEventListener('dragleave', event => {
                if (!button.contains(event.relatedTarget)) button.classList.remove('drag-over');
            });
            button.addEventListener('drop', event => {
                event.preventDefault();
                event.stopPropagation();
                button.classList.remove('drag-over');
                if (!draggedListItem || draggedListSection !== currentSection || draggedListItem === item) return;
                const list = storageForSection(currentSection);
                const sourceIndex = list.indexOf(draggedListItem);
                const targetIndex = list.indexOf(item);
                if (sourceIndex < 0 || targetIndex < 0) return;
                const [moved] = list.splice(sourceIndex, 1);
                list.splice(targetIndex, 0, moved);
                selectedItem = moved;
                markDirty();
                renderList();
                renderEditor();
                setStatus('Ordem alterada. O catalogo.json será baixado nesta nova sequência.', 'success');
            });
            button.addEventListener('dragend', () => {
                draggedListItem = null;
                draggedListSection = null;
                itemList.querySelectorAll('.dragging, .drag-over').forEach(element => {
                    element.classList.remove('dragging', 'drag-over');
                });
            });
        }

        function renderCategoryManager(parent, key, title, kind) {
            const categories = catalog[key];
            const panel = createPanel(title, 'A ordem abaixo é a mesma exibida no aplicativo. Categorias vazias ficam ocultas na TV.');
            panel.actions.appendChild(actionButton('Adicionar categoria', 'primary', () => {
                const baseTitle = kind === 'album' ? 'Nova categoria musical' : 'Nova categoria de extras';
                const category = {
                    id: uniqueId(baseTitle), title: baseTitle, iconPath: ''
                };
                if (kind === 'extra') {
                    category.continueWatching = true;
                    category.autoAdvance = false;
                }
                categories.push(category);
                markDirty();
                renderAll();
            }));
            categories.forEach((category, index) => {
                const details = document.createElement('details');
                details.className = 'collection-item';
                details.open = false;
                const summary = document.createElement('summary');
                const label = document.createElement('strong');
                label.textContent = category.title || category.id || 'Categoria';
                const actions = document.createElement('span');
                actions.className = 'collection-actions';
                actions.append(
                    compactButton('↑', 'Mover para cima', event => moveCategoryItem(categories, index, -1, event)),
                    compactButton('↓', 'Mover para baixo', event => moveCategoryItem(categories, index, 1, event)),
                    compactButton('×', 'Excluir categoria', event => {
                        event.preventDefault(); event.stopPropagation();
                        const used = kind === 'album'
                            ? catalog.albums.filter(item => albumCategory(item) === category.id).length
                            : catalog.extras.filter(item => String(item.category || 'outros') === category.id).length;
                        if (used) {
                            window.alert(`Esta categoria contém ${used} item(ns). Mova o conteúdo para outra categoria antes de excluí-la.`);
                            return;
                        }
                        categories.splice(index, 1);
                        markDirty(); renderAll();
                    }, true)
                );
                const body = document.createElement('div');
                body.className = 'collection-body';
                const grid = createGrid('field-grid');
                const oldId = category.id;
                addField(grid, category, 'id', 'ID da categoria', {
                    onChange: value => {
                        const normalized = slugify(value) || (kind === 'album' ? 'musicas' : 'extras');
                        category.id = normalized;
                        const items = kind === 'album' ? catalog.albums : catalog.extras;
                        items.forEach(item => {
                            const itemCategory = kind === 'album' ? albumCategory(item) : String(item.category || 'outros');
                            if (itemCategory === oldId) item.category = normalized;
                        });
                        markDirty(); renderAll();
                    }
                });
                addField(grid, category, 'title', 'Nome exibido', { onChange: () => { markDirty(); renderAll(); } });
                addField(grid, category, 'iconPath', 'Ícone da categoria (opcional)', { full: true, path: true });
                if (kind === 'extra') {
                    addField(grid, category, 'continueWatching', 'Salvar em Continue Assistindo', {
                        select: [['true', 'Sim'], ['false', 'Não']],
                        onChange: value => { category.continueWatching = value === 'true'; markDirty(); }
                    });
                    addField(grid, category, 'autoAdvance', 'Reproduzir próximo automaticamente', {
                        select: [['false', 'Não'], ['true', 'Sim']],
                        onChange: value => { category.autoAdvance = value === 'true'; markDirty(); }
                    });
                }
                body.appendChild(grid);
                summary.append(label, actions);
                details.append(summary, body);
                panel.body.appendChild(details);
            });
            parent.appendChild(panel.element);
        }

        function moveCategoryItem(categories, index, direction, event) {

            if (destination < 0 || destination >= categories.length) return;
            [categories[index], categories[destination]] = [categories[destination], categories[index]];
            markDirty(); renderAll();
        }

            const element = document.createElement('section');

                const p = document.createElement('p');

            }
            const actions = document.createElement('div');
            actions.className = 'editor-actions';
            heading.append(copy, actions);
            const body = document.createElement('div');
            element.append(heading, body);
            return { element, heading, actions, body };
        }

        function createGrid(className) {
            const grid = document.createElement('div');
            grid.className = className;
            return grid;
        }

        function addField(parent, object, key, labelText, options = {}) {
            const wrapper = document.createElement('div');
            wrapper.className = `field${options.full ? ' full' : ''}`;
            const label = document.createElement('label');
            const controlId = `field-${Math.random().toString(36).slice(2)}`;
            label.htmlFor = controlId;
            label.textContent = labelText;
            let control;
            if (options.select) {
                control = document.createElement('select');
                options.select.forEach(([value, text]) => {
                    const option = document.createElement('option');
                    option.value = value;
                    option.textContent = text;
                    control.appendChild(option);
                });
            } else if (options.textarea) {
                control = document.createElement('textarea');
            } else {
                control = document.createElement('input');
                control.type = options.type || 'text';
            }
            control.id = controlId;
            control.value = object[key] == null ? '' : object[key];
            if (options.placeholder) control.placeholder = options.placeholder;
            if (options.path) control.classList.add('path-input');
            control.addEventListener('input', () => {
                if (options.type === 'number') object[key] = Number(control.value || 0);
                else object[key] = control.value;
                markDirty();
                if (options.onInput) options.onInput(control.value);
            });
            control.addEventListener('change', () => {
                if (options.path) {
                    control.value = normalizePath(control.value);
                    object[key] = control.value;
                }
                if (options.onChange) options.onChange(control.value);
                else markDirty();
            });
            wrapper.append(label, control);
            if (options.path) {
                const hint = document.createElement('small');
                hint.textContent = 'Use / entre as pastas. Espaços serão convertidos para %20 ao baixar.';
                wrapper.appendChild(hint);
            }
            parent.appendChild(wrapper);
            return control;
        }

        function actionButton(label, style, handler) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = `button small ${style || ''}`.trim();
            button.textContent = label;
            button.addEventListener('click', handler);
            return button;
        }

        function albumAudioRoot(album) {
            const category = albumCategory(album);
            if (category === 'remixes') return 'media/albuns-remixes';
            if (category === 'compilation') return 'media/compilacoes';
            if (category === 'unreleased') return 'media/musicas-nao-lancadas';
            return 'media/albuns';
        }

        function existingAlbumAudioFolder(album) {
            const candidates = [
                ...(Array.isArray(album.tracks) ? album.tracks.map(track => track.audioPath || track.audioUrl || '') : []),
                album.coverPath || '',
                album.animatedCoverPath || '',
                album.backgroundPath || ''
            ];
            for (const candidate of candidates) {
                const clean = String(candidate).trim().replace(/\\/g, '/');
                const slash = clean.lastIndexOf('/');
                if (slash > 0) return clean.slice(0, slash);
            }
            return '';
        }

        function repositoryPathFromFile(file, album) {
            const original = String(file.path || file.webkitRelativePath || file.name || '').replace(/\\/g, '/');
            const parts = original.split('/').filter(Boolean);
            const lowerParts = parts.map(part => part.toLowerCase());
            const githubIndex = lowerParts.lastIndexOf('github');
            if (githubIndex >= 0 && parts.length > githubIndex + 2) {
                return parts.slice(githubIndex + 2).join('/');
            }
            const mediaIndex = lowerParts.indexOf('media');
            if (mediaIndex >= 0) return parts.slice(mediaIndex).join('/');
            if (original.includes('/')) return `${albumAudioRoot(album)}/${original}`;
            const knownFolder = existingAlbumAudioFolder(album);
            if (knownFolder) return `${knownFolder}/${file.name}`;
            return `${albumAudioRoot(album)}/${album.title || album.id || 'novo-album'}/${file.name}`;
        }

        function addSelectedMusicFiles(album, tracks, fileList) {
            const audioExtensions = /\.(mp3|m4a|aac|flac|ogg|oga|wav|opus|wma)$/i;
            const files = [...fileList]
                .filter(file => audioExtensions.test(file.name) || String(file.type || '').startsWith('audio/'))
                .sort((left, right) => {
                    const leftPath = left.webkitRelativePath || left.name;
                    const rightPath = right.webkitRelativePath || right.name;
                    return leftPath.localeCompare(rightPath, 'pt-BR', { numeric: true, sensitivity: 'base' });
                });
            if (!files.length) {
                setStatus('A pasta selecionada não contém músicas compatíveis.', 'error');
                return;
            }
            const existingPaths = new Set(tracks.map(track => normalizePath(track.audioPath || track.audioUrl || '').toLowerCase()));
            let added = 0;
            let skipped = 0;
            files.forEach(file => {
                const audioPath = repositoryPathFromFile(file, album);
                const comparablePath = normalizePath(audioPath).toLowerCase();
                if (existingPaths.has(comparablePath)) {
                    skipped++;
                    return;
                }
                const title = file.name.replace(/\.[^.]+$/, '');
                const numberMatch = title.match(/^\s*(\d{1,3})/);
                const relativeParts = String(file.webkitRelativePath || '').replace(/\\/g, '/').split('/');
                const disc = relativeParts.find(part => /^(disco|disc|cd)\s*\d+/i.test(part)) || '';
                const track = {
                    number: numberMatch ? numberMatch[1] : String(tracks.length + 1),
                    title,
                    audioPath
                };
                if (disc) track.disc = disc;
                tracks.push(track);
                existingPaths.add(comparablePath);
                added++;
            });
            if (!added) {
                setStatus('Todas as músicas selecionadas já estavam cadastradas.', 'error');
                return;
            }
            markDirty();
            renderEditor();
            renderCounts();
            setStatus(`${added} música(s) adicionada(s)${skipped ? `; ${skipped} repetida(s) ignorada(s)` : ''}. Você pode abrir cada faixa para editar.`, 'success');
        }

        function chooseAlbumMusicFolder(album, tracks) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'audio/*,.mp3,.m4a,.aac,.flac,.ogg,.oga,.wav,.opus,.wma';
            input.multiple = true;
            input.setAttribute('webkitdirectory', '');
            input.setAttribute('directory', '');
            input.style.display = 'none';
            input.addEventListener('change', () => {
                addSelectedMusicFiles(album, tracks, input.files);
                input.remove();
            }, { once: true });
            input.addEventListener('cancel', () => input.remove(), { once: true });
            document.body.appendChild(input);
            input.click();
        }

        function renderTracksPanel(parent, owner, key, title) {
            if (!Array.isArray(owner[key])) owner[key] = [];
            const tracks = owner[key];
            const panel = createPanel(title, `${tracks.length} faixa(s). Clique em “Adicionar músicas” e escolha a pasta do álbum; todos os arquivos de áudio serão importados em ordem.`);
            panel.actions.appendChild(actionButton('Adicionar músicas', 'primary', () => chooseAlbumMusicFolder(owner, tracks)));

            if (!tracks.length) {
                const empty = document.createElement('div');
                empty.className = 'collection-empty';
                empty.textContent = 'Nenhuma faixa cadastrada.';
                panel.body.appendChild(empty);
            }

            tracks.forEach((track, index) => {
                const details = document.createElement('details');
                details.className = 'collection-item';
                const summary = document.createElement('summary');
                const copy = document.createElement('span');
                copy.className = 'summary-copy';
                const refreshSummary = () => copy.textContent = `${track.number || index + 1} — ${track.title || 'Faixa sem título'}`;
                refreshSummary();
                const actions = document.createElement('span');
                actions.className = 'row-actions';
                actions.append(
                    compactButton('↑', 'Mover faixa para cima', event => moveArrayItem(tracks, index, -1, event)),
                    compactButton('↓', 'Mover faixa para baixo', event => moveArrayItem(tracks, index, 1, event)),
                    compactButton('Excluir', 'Excluir faixa', event => {
                        event.preventDefault(); event.stopPropagation();
                        if (!window.confirm(`Excluir a faixa “${track.title || 'sem título'}”?`)) return;
                        tracks.splice(index, 1); markDirty(); renderEditor(); renderCounts();
                    }, true)
                );
                summary.append(copy, actions);
                const body = document.createElement('div');
                body.className = 'collection-body';
                const grid = createGrid('field-grid three');
                addField(grid, track, 'number', 'Número', { onInput: refreshSummary });
                addField(grid, track, 'disc', 'Disco');
                addField(grid, track, 'duration', 'Duração');
                addField(grid, track, 'title', 'Nome da faixa', { full: true, onInput: refreshSummary });
                addField(grid, track, 'audioPath', 'Caminho do áudio', { full: true, path: true });
                body.appendChild(grid);
                details.append(summary, body);
                panel.body.appendChild(details);
            });
            parent.appendChild(panel.element);
        }

        function compactButton(label, ariaLabel, handler, danger = false) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = `button small icon${danger ? ' danger' : ''}`;
            button.textContent = label;
            button.setAttribute('aria-label', ariaLabel);
            button.addEventListener('click', handler);
            return button;
        }

        function moveArrayItem(array, index, direction, event) {
            event.preventDefault(); event.stopPropagation();
            const destination = index + direction;
            if (destination < 0 || destination >= array.length) return;
            [array[index], array[destination]] = [array[destination], array[index]];
            markDirty(); renderEditor();
        }

        function addItem() {
            if (currentSection === 'settings') return;
            const definition = sectionDefinitions[currentSection];
            let item;
            if (definition.kind === 'album') {
                const label = `Novo item — ${definition.label}`;
                item = {
                    id: uniqueId(label),
                    title: label,
                    artist: catalog.artist || 'Britney Spears',
                    year: '',
                    genre: 'Pop',
                    category: definition.category,
                    coverPath: '',
                    animatedCoverPath: '',
                    backgroundPath: '',
                    tracks: []
                };
                catalog.albums.push(item);
            } else {
                const isClip = definition.storage === 'clips';
                const isShow = definition.storage === 'shows';
                const mediaLabel = isClip ? 'novo-clipe' : isShow ? 'novo-show' : 'novo-extra';
                const mediaTitle = isClip ? 'Novo clipe' : isShow ? 'Novo show' : 'Novo vídeo extra';
                item = {
                    id: uniqueId(mediaLabel),
                    title: mediaTitle,
                    artist: catalog.artist || 'Britney Spears',
                    year: '', duration: '', description: '',
                    videoPath: '', thumbnailPath: '', backgroundPath: '', logoPath: '', subtitles: []
                };
                if (isShow) {
                    item.location = '';
                    item.variants = [];
                }
                if (definition.storage === 'extras') item.category = definition.category;
                catalog[definition.storage].push(item);
            }
            selectedItem = item;
            searchInput.value = '';
            markDirty(); renderAll();
        }

        function duplicateItem(item) {
            const copy = JSON.parse(JSON.stringify(item));
            copy.id = uniqueId(`${item.id || item.title || 'item'}-copia`);
            copy.title = `${item.title || 'Item'} — cópia`;
            const definition = sectionDefinitions[currentSection];
            if (definition.storage === 'shows' && Array.isArray(copy.variants)) {
                copy.variants.forEach((variant, index) => {
                    variant.id = uniqueId(`${copy.id}-${variant.location || `versao-${index + 2}`}`);
                });
            }
            if (definition.kind === 'album') catalog.albums.push(copy);
            else catalog[definition.storage].push(copy);
            selectedItem = copy;
            markDirty(); renderAll();
        }

        function deleteCurrentItem() {
            if (!selectedItem) return;
            if (!window.confirm(`Excluir “${selectedItem.title || selectedItem.id || 'este item'}” do catálogo?`)) return;
            const definition = sectionDefinitions[currentSection];
            const array = definition.kind === 'album' ? catalog.albums : catalog[definition.storage];
            const index = array.indexOf(selectedItem);
            if (index >= 0) array.splice(index, 1);
            selectedItem = itemsForSection()[0] || null;
            markDirty(); renderAll();
        }

        function validateCatalog() {
            const errors = [];
            const warnings = [];
            const ids = new Map();
            const addId = (item, location) => {
                if (!item.id) errors.push(`${location}: ID vazio.`);
                else if (ids.has(item.id)) errors.push(`ID repetido “${item.id}” em ${ids.get(item.id)} e ${location}.`);
                else ids.set(item.id, location);
                if (!item.title) errors.push(`${location}: título vazio.`);
            };
            const validatePath = (value, location, required = true) => {
                if (!value) {
                    if (required) warnings.push(`${location}: caminho vazio.`);
                    return;
                }
                if (value.includes('\\')) errors.push(`${location}: use / em vez de \\.`);
                if (value.includes(' ')) warnings.push(`${location}: contém espaços; eles serão convertidos para %20 no download.`);
            };
            const validateSubtitles = (subtitles, owner) => (subtitles || []).forEach((subtitle, subtitleIndex) => {
                const subtitlePlace = `${owner} / legenda ${subtitleIndex + 1}`;
                validatePath(subtitle.subtitlePath || subtitle.path || subtitle.url, subtitlePlace);
                const subtitlePath = String(subtitle.subtitlePath || subtitle.path || subtitle.url || '').toLowerCase().split('?')[0];
                if (subtitlePath && !/\.(vtt|srt|ass|ssa|ttml|xml)$/.test(subtitlePath)) {
                    warnings.push(`${subtitlePlace}: prefira .vtt, .srt, .ass, .ssa ou .ttml.`);
                }
                if (!subtitle.label && !subtitle.language) warnings.push(`${subtitlePlace}: informe um nome ou código de idioma.`);
            });
            const musicCategoryIds = new Set();
            catalog.musicCategories.forEach((category, index) => {
                const place = `Categoria musical ${index + 1}`;
                if (!category.id) errors.push(`${place}: ID vazio.`);
                else if (musicCategoryIds.has(category.id)) errors.push(`${place}: ID repetido “${category.id}”.`);
                else musicCategoryIds.add(category.id);
                if (!category.title) errors.push(`${place}: nome vazio.`);
                validatePath(category.iconPath || category.iconUrl, `${place} / ícone`, false);
            });
            const extraCategoryIds = new Set();
            catalog.extraCategories.forEach((category, index) => {
                const place = `Categoria de Extra ${index + 1}`;
                if (!category.id) errors.push(`${place}: ID vazio.`);
                else if (extraCategoryIds.has(category.id)) errors.push(`${place}: ID repetido “${category.id}”.`);
                else extraCategoryIds.add(category.id);
                if (!category.title) errors.push(`${place}: nome vazio.`);
                validatePath(category.iconPath || category.iconUrl, `${place} / ícone`, false);
            });
            catalog.albums.forEach((album, albumIndex) => {
                const place = `Álbum ${albumIndex + 1}`;
                addId(album, place);
                if (!musicCategoryIds.has(albumCategory(album))) errors.push(`${place}: categoria “${album.category}” não existe.`);
                validatePath(album.coverPath, `${place} / capa`, false);
                const validateTracks = (tracks, owner) => (tracks || []).forEach((track, index) => {
                    if (!track.title) warnings.push(`${owner} / faixa ${index + 1}: título vazio.`);
                    validatePath(track.audioPath || track.audioUrl, `${owner} / faixa ${index + 1} / áudio`);
                });
                validateTracks(album.tracks, place);
            });
            ['clips', 'shows', 'extras'].forEach(section => catalog[section].forEach((item, index) => {
                const place = `${section === 'clips' ? 'Clipe' : section === 'shows' ? 'Show' : 'Extra'} ${index + 1}`;
                addId(item, place);
                if (section === 'extras' && !extraCategoryIds.has(String(item.category || 'outros'))) {
                    errors.push(`${place}: categoria de Extra “${item.category || 'outros'}” não existe.`);
                }
                validatePath(item.videoPath || item.videoUrl, `${place} / vídeo`);
                validatePath(item.thumbnailPath || item.thumbnailUrl, `${place} / miniatura`, false);
                validatePath(item.backgroundPath || item.backgroundUrl, `${place} / fundo`, false);
                validatePath(item.logoPath || item.logoUrl, `${place} / logo`, false);
                validateSubtitles(item.subtitles, place);
                if (section === 'shows') (item.variants || []).forEach((variant, variantIndex) => {
                    const variantPlace = `${place} / variante ${variantIndex + 1}`;
                    addId(variant, variantPlace);
                    if (!variant.location) warnings.push(`${variantPlace}: informe a cidade ou o nome da versão.`);
                    validatePath(variant.videoPath || variant.videoUrl, `${variantPlace} / vídeo`);
                    validatePath(variant.thumbnailPath || variant.thumbnailUrl, `${variantPlace} / miniatura`, false);
                    validatePath(variant.backgroundPath || variant.backgroundUrl, `${variantPlace} / fundo`, false);
                    validatePath(variant.logoPath || variant.logoUrl, `${variantPlace} / logo`, false);
                    validateSubtitles(variant.subtitles, variantPlace);
                });
            }));
            showValidation(errors, warnings);
            return errors.length === 0;
        }

        function showValidation(errors, warnings) {
            const view = editorShell('Validação do catálogo', `${errors.length} erro(s) e ${warnings.length} aviso(s).`);
            const panel = createPanel(errors.length ? 'O catálogo precisa de correções' : 'Estrutura compatível', 'A verificação analisa campos, IDs e formato dos caminhos.');
            const list = document.createElement('ul');
            list.className = 'validation-list';
            if (!errors.length && !warnings.length) {
                const item = document.createElement('li');
                item.className = 'validation-ok';
                item.textContent = 'Nenhum problema encontrado.';
                list.appendChild(item);
            }
            errors.forEach(message => {
                const item = document.createElement('li');
                item.className = 'validation-error'; item.textContent = message; list.appendChild(item);
            });
            warnings.forEach(message => {
                const item = document.createElement('li');
                item.className = 'validation-warning'; item.textContent = message; list.appendChild(item);
            });
            panel.body.appendChild(list);
            view.shell.appendChild(panel.element);
            setStatus(errors.length ? 'Validação concluída com erros.' : 'Validação concluída.', errors.length ? 'error' : 'success');
        }

        function formatCatalog() {
            return JSON.stringify(normalizedExportCatalog(), null, 2) + '\n';
        }

        function downloadCatalog() {
            if (!validateCatalog()) {
                if (!window.confirm('Existem erros no catálogo. Deseja baixar mesmo assim?')) return;
            }
            const content = formatCatalog();
            const blob = new Blob([content], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'catalogo.json';
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            clearDirty();
            setStatus('catalogo.json gerado. Substitua o arquivo no repositório e faça o commit.', 'success');
        }

        function showPreview() {
            jsonPreview.value = formatCatalog();
            previewDialog.showModal();
        }

        document.querySelectorAll('.section-button[data-section]').forEach(button => {
            button.addEventListener('click', () => selectSection(button.dataset.section));
        });
        searchInput.addEventListener('input', renderList);
        addItemButton.addEventListener('click', addItem);
        document.getElementById('loadSiteButton').addEventListener('click', () => loadCatalogFromSite(true));
        document.getElementById('openFileButton').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => { loadCatalogFile(fileInput.files[0]); fileInput.value = ''; });
        document.getElementById('validateButton').addEventListener('click', validateCatalog);
        document.getElementById('previewButton').addEventListener('click', showPreview);
        document.getElementById('downloadButton').addEventListener('click', downloadCatalog);
        document.getElementById('downloadPreviewButton').addEventListener('click', downloadCatalog);
        document.getElementById('closePreviewButton').addEventListener('click', () => previewDialog.close());
        document.getElementById('copyPreviewButton').addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(jsonPreview.value);
                setStatus('JSON copiado para a área de transferência.', 'success');
            } catch (error) {
                jsonPreview.select();
                document.execCommand('copy');
                setStatus('JSON copiado.', 'success');
            }
        });
        document.addEventListener('dragover', event => event.preventDefault());
        document.addEventListener('drop', event => {
            event.preventDefault();
            const file = [...event.dataTransfer.files].find(item => item.name.toLowerCase().endsWith('.json'));
            if (file) loadCatalogFile(file);
        });
        window.addEventListener('beforeunload', event => {
            if (!dirty) return;
            event.preventDefault();
            event.returnValue = '';
        });

        loadCatalogFromSite(false);
    </script>
</body>
</html>
