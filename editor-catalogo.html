<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor do catálogo — It's Britney, App!</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #070913;
            --surface: #101421;
            --surface-2: #171c2d;
            --surface-3: #20263a;
            --text: #f7f7fb;
            --muted: #aeb5c8;
            --line: #30374d;
            --pink: #ff3896;
            --pink-soft: rgba(255, 56, 150, .14);
            --blue: #30b9ff;
            --green: #4bd59a;
            --red: #ff6577;
            --yellow: #ffc857;
            --radius: 16px;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% -10%, rgba(255, 56, 150, .16), transparent 32rem),
                radial-gradient(circle at 95% 10%, rgba(48, 185, 255, .11), transparent 30rem),
                var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button, input, textarea, select { font: inherit; }
        button { cursor: pointer; }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 18px 24px;
            border-bottom: 1px solid var(--line);
            background: rgba(7, 9, 19, .92);
            backdrop-filter: blur(18px);
        }

        .brand { min-width: 220px; }
        .brand h1 { margin: 0; font-size: 21px; font-weight: 700; }
        .brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

        .top-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 9px; }
        .button {
            min-height: 42px;
            padding: 9px 14px;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: var(--surface-2);
            color: var(--text);
            font-weight: 650;
        }
        .button:hover { border-color: #59627e; background: var(--surface-3); }
        .button.primary { border-color: var(--pink); background: var(--pink); color: white; }
        .button.primary:hover { background: #f52287; }
        .button.danger { color: #ffdce2; border-color: rgba(255, 101, 119, .55); background: rgba(255, 101, 119, .1); }
        .button.small { min-height: 34px; padding: 6px 10px; font-size: 13px; border-radius: 9px; }
        .button.icon { min-width: 34px; padding: 6px 8px; }

        .status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: 45px;
            padding: 10px 24px;
            color: var(--muted);
            border-bottom: 1px solid var(--line);
            background: rgba(16, 20, 33, .75);
            font-size: 14px;
        }
        .status.success { color: var(--green); }
        .status.error { color: #ff9aa6; }
        .dirty { color: var(--yellow); font-weight: 700; white-space: nowrap; }

        .layout {
            display: grid;
            grid-template-columns: 360px minmax(0, 1fr);
            min-height: calc(100vh - 115px);
        }

        .sidebar {
            padding: 20px;
            border-right: 1px solid var(--line);
            background: rgba(10, 13, 24, .72);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }
        .summary-item { padding: 11px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
        .summary-item strong { display: block; font-size: 21px; }
        .summary-item span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }

        .sections { display: grid; gap: 6px; margin-bottom: 15px; }
        .section-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-height: 42px;
            padding: 9px 12px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            text-align: left;
        }
        .section-button:hover { color: var(--text); background: var(--surface-2); }
        .section-button.active { color: white; border-color: rgba(255, 56, 150, .45); background: var(--pink-soft); }
        .section-count { min-width: 28px; padding: 2px 7px; border-radius: 999px; background: var(--surface-3); text-align: center; font-size: 12px; }

        .search { margin: 14px 0 10px; }
        .search input { width: 100%; }

        .list-toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
        .list-toolbar .button { flex: 1; }
        .item-list { display: grid; gap: 8px; }
        .list-item {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface);
            color: var(--text);
            text-align: left;
        }
        .list-item:hover { border-color: #59627e; }
        .list-item.active { border-color: var(--pink); background: var(--pink-soft); }
        .list-item strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .list-item span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .empty-list { padding: 18px 10px; color: var(--muted); text-align: center; }

        .workspace { min-width: 0; padding: 28px; }
        .editor-shell { max-width: 1050px; margin: 0 auto; }
        .editor-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 22px;
        }
        .editor-header h2 { margin: 0; font-size: 26px; }
        .editor-header p { margin: 6px 0 0; color: var(--muted); }
        .editor-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

        .panel {
            margin-bottom: 18px;
            padding: 20px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: rgba(16, 20, 33, .9);
        }
        .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
        .panel-heading h3 { margin: 0; font-size: 18px; }
        .panel-heading p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

        .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
        .field-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .field { min-width: 0; }
        .field.full { grid-column: 1 / -1; }
        .field label { display: block; margin: 0 0 7px; color: #dce1ee; font-size: 13px; font-weight: 650; }
        .field small { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; }
        input, textarea, select {
            width: 100%;
            min-height: 43px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            outline: none;
            background: #0b0f1b;
            color: var(--text);
        }
        textarea { min-height: 92px; resize: vertical; }
        input:focus, textarea:focus, select:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255, 56, 150, .12); }
        .path-input { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }

        details.collection-item { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; background: #0b0f1b; overflow: hidden; }
        details.collection-item[open] { border-color: #4a536f; }
        details.collection-item > summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 49px;
            padding: 10px 12px;
            cursor: pointer;
            list-style: none;
        }
        details.collection-item > summary::-webkit-details-marker { display: none; }
        .summary-copy { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
        .row-actions { display: flex; gap: 6px; flex: 0 0 auto; }
        .collection-body { padding: 15px; border-top: 1px solid var(--line); }
        .collection-empty { padding: 12px 0; color: var(--muted); }

        .validation-list { margin: 0; padding-left: 20px; }
        .validation-list li { margin: 7px 0; }
        .validation-ok { color: var(--green); }
        .validation-warning { color: var(--yellow); }
        .validation-error { color: #ff9aa6; }

        dialog { width: min(940px, calc(100% - 32px)); padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); }
        dialog::backdrop { background: rgba(0, 0, 0, .72); backdrop-filter: blur(4px); }
        .dialog-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 20px; border-bottom: 1px solid var(--line); }
        .dialog-header h2 { margin: 0; font-size: 20px; }
        .dialog-body { padding: 20px; }
        #jsonPreview { min-height: 58vh; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; white-space: pre; }

        .welcome { max-width: 760px; margin: 60px auto; padding: 34px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); text-align: center; }
        .welcome h2 { margin-top: 0; }
        .welcome p { color: var(--muted); line-height: 1.6; }
        .welcome-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }

        @media (max-width: 900px) {
            .topbar { align-items: flex-start; flex-direction: column; }
            .top-actions { justify-content: flex-start; }
            .layout { grid-template-columns: 1fr; }
            .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
            .sections { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .item-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 620px) {
            .topbar, .status, .sidebar, .workspace { padding-left: 14px; padding-right: 14px; }
            .top-actions, .top-actions .button { width: 100%; }
            .field-grid, .field-grid.three { grid-template-columns: 1fr; }
            .field.full { grid-column: auto; }
            .item-list { grid-template-columns: 1fr; }
            .editor-header { flex-direction: column; }
            .editor-actions { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <h1>Editor do catálogo</h1>
            <p>It's Britney, App! + site</p>
        </div>
        <div class="top-actions">
            <button class="button" id="loadSiteButton" type="button">Carregar catalogo.json</button>
            <button class="button" id="openFileButton" type="button">Abrir arquivo JSON</button>
            <button class="button" id="previewButton" type="button">Visualizar JSON</button>
            <button class="button" id="validateButton" type="button">Validar</button>
            <button class="button primary" id="downloadButton" type="button">Baixar catalogo.json</button>
            <input id="jsonFileInput" type="file" accept="application/json,.json" hidden>
        </div>
    </header>

    <div class="status" id="statusBar" aria-live="polite">
        <span id="statusText">Carregando o catálogo da mesma pasta…</span>
        <span class="dirty" id="dirtyText"></span>
    </div>

    <main class="layout">
        <aside class="sidebar">
            <div class="summary-grid" aria-label="Resumo do catálogo">
                <div class="summary-item"><strong id="albumCount">0</strong><span>álbuns</span></div>
                <div class="summary-item"><strong id="trackCount">0</strong><span>faixas</span></div>
                <div class="summary-item"><strong id="videoCount">0</strong><span>vídeos</span></div>
            </div>

            <nav class="sections" aria-label="Categorias">
                <button class="section-button" type="button" data-section="settings"><span>Configurações</span></button>
                <button class="section-button" type="button" data-section="main"><span>Álbuns</span><span class="section-count">0</span></button>
                <button class="section-button" type="button" data-section="compilation"><span>Compilações</span><span class="section-count">0</span></button>
                <button class="section-button" type="button" data-section="unreleased"><span>Não lançadas</span><span class="section-count">0</span></button>
                <button class="section-button" type="button" data-section="clips"><span>Clipes</span><span class="section-count">0</span></button>
                <button class="section-button" type="button" data-section="shows"><span>Shows</span><span class="section-count">0</span></button>
            </nav>

            <div class="search">
                <label for="searchInput" style="display:none">Pesquisar conteúdo</label>
                <input id="searchInput" type="search" placeholder="Pesquisar nesta categoria">
            </div>
            <div class="list-toolbar">
                <button class="button small" id="addItemButton" type="button">Adicionar conteúdo</button>
            </div>
            <div class="item-list" id="itemList"></div>
        </aside>

        <section class="workspace" id="workspace"></section>
    </main>

    <dialog id="previewDialog">
        <div class="dialog-header">
            <h2>Prévia do catalogo.json</h2>
            <button class="button small" id="closePreviewButton" type="button">Fechar</button>
        </div>
        <div class="dialog-body">
            <textarea id="jsonPreview" readonly spellcheck="false"></textarea>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px">
                <button class="button" id="copyPreviewButton" type="button">Copiar JSON</button>
                <button class="button primary" id="downloadPreviewButton" type="button">Baixar</button>
            </div>
        </div>
    </dialog>

    <script>
        const sectionDefinitions = {
            main: { label: 'Álbuns', category: 'main', kind: 'album' },
            compilation: { label: 'Compilações', category: 'compilation', kind: 'album' },
            unreleased: { label: 'Músicas não lançadas', category: 'unreleased', kind: 'album' },
            clips: { label: 'Clipes', kind: 'media' },
            shows: { label: 'Shows', kind: 'media' }
        };

        let catalog = createEmptyCatalog();
        let currentSection = 'main';
        let selectedItem = null;
        let dirty = false;

        const workspace = document.getElementById('workspace');
        const itemList = document.getElementById('itemList');
        const searchInput = document.getElementById('searchInput');
        const addItemButton = document.getElementById('addItemButton');
        const statusBar = document.getElementById('statusBar');
        const statusText = document.getElementById('statusText');
        const dirtyText = document.getElementById('dirtyText');
        const fileInput = document.getElementById('jsonFileInput');
        const previewDialog = document.getElementById('previewDialog');
        const jsonPreview = document.getElementById('jsonPreview');

        function createEmptyCatalog() {
            return {
                schemaVersion: 1,
                title: 'Discografia Britney Spears',
                artist: 'Britney Spears',
                assetBaseUrl: 'https://zayandoux.github.io/britneyspears/',
                assetUrlRule: 'O aplicativo deve juntar assetBaseUrl com cada campo terminado em Path.',
                albums: [],
                clips: [],
                shows: []
            };
        }

        function normalizeCatalog(value) {
            if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('O conteúdo não é um objeto JSON válido.');
            if (!Array.isArray(value.albums)) value.albums = [];
            if (!Array.isArray(value.clips)) value.clips = [];
            if (!Array.isArray(value.shows)) value.shows = [];
            if (!value.schemaVersion) value.schemaVersion = 1;
            if (!value.title) value.title = 'Discografia Britney Spears';
            if (!value.artist) value.artist = 'Britney Spears';
            if (!value.assetBaseUrl) value.assetBaseUrl = 'https://zayandoux.github.io/britneyspears/';
            return value;
        }

        function albumCategory(album) {
            const value = String(album.category || 'main').toLowerCase();
            if (value === 'compilation' || value === 'official-compilations') return 'compilation';
            if (value === 'unreleased' || value === 'unreleased-music' || value === 'musicas-nao-lancadas') return 'unreleased';
            return 'main';
        }

        function itemsForSection(section = currentSection) {
            if (section === 'settings') return [];
            if (section === 'clips') return catalog.clips;
            if (section === 'shows') return catalog.shows;
            return catalog.albums.filter(album => albumCategory(album) === section);
        }

        function countAlbumTracks(album) {
            let total = Array.isArray(album.tracks) ? album.tracks.length : 0;
            if (Array.isArray(album.versions)) {
                total += album.versions.reduce((sum, version) => sum + (Array.isArray(version.tracks) ? version.tracks.length : 0), 0);
            }
            return total;
        }

        function setStatus(message, kind = '') {
            statusText.textContent = message;
            statusBar.className = `status ${kind}`.trim();
        }

        function markDirty() {
            dirty = true;
            dirtyText.textContent = 'Alterações ainda não baixadas';
        }

        function clearDirty() {
            dirty = false;
            dirtyText.textContent = '';
        }

        function escapeText(value) {
            return String(value == null ? '' : value);
        }

        function slugify(value) {
            return String(value || 'novo-item')
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'novo-item';
        }

        function uniqueId(base) {
            const used = new Set([
                ...catalog.albums.map(item => item.id),
                ...catalog.clips.map(item => item.id),
                ...catalog.shows.map(item => item.id)
            ]);
            let id = slugify(base);
            let suffix = 2;
            while (used.has(id)) id = `${slugify(base)}-${suffix++}`;
            return id;
        }

        function normalizePath(value) {
            return String(value || '').trim().replace(/\\/g, '/').replace(/ /g, '%20');
        }

        function normalizedExportCatalog() {
            const copy = JSON.parse(JSON.stringify(catalog));
            const visit = node => {
                if (Array.isArray(node)) return node.forEach(visit);
                if (!node || typeof node !== 'object') return;
                Object.keys(node).forEach(key => {
                    if (key.endsWith('Path') && typeof node[key] === 'string') node[key] = normalizePath(node[key]);
                    else visit(node[key]);
                });
            };
            visit(copy);
            return copy;
        }

        function applyLoadedCatalog(value, sourceLabel) {
            catalog = normalizeCatalog(value);
            currentSection = 'main';
            selectedItem = itemsForSection()[0] || null;
            searchInput.value = '';
            clearDirty();
            renderAll();
            setStatus(`${sourceLabel} — ${catalog.albums.length} álbuns, ${catalog.clips.length} clipe(s) e ${catalog.shows.length} show(s).`, 'success');
        }

        async function loadCatalogFromSite(force = false) {
            if (force && dirty && !window.confirm('Descartar as alterações atuais e carregar o catalogo.json novamente?')) return;
            setStatus('Carregando catalogo.json…');
            try {
                const response = await fetch(`catalogo.json?v=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                applyLoadedCatalog(await response.json(), 'Catálogo carregado');
            } catch (error) {
                setStatus('Não foi possível carregar automaticamente. Clique em “Abrir arquivo JSON”.', 'error');
                renderWelcome();
            }
        }

        function loadCatalogFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    applyLoadedCatalog(JSON.parse(reader.result), `Arquivo ${file.name} carregado`);
                } catch (error) {
                    setStatus(`Erro ao abrir ${file.name}: ${error.message}`, 'error');
                }
            };
            reader.onerror = () => setStatus('Não foi possível ler o arquivo selecionado.', 'error');
            reader.readAsText(file, 'UTF-8');
        }

        function renderAll() {
            renderCounts();
            renderSectionButtons();
            renderList();
            renderEditor();
        }

        function renderCounts() {
            const totalTracks = catalog.albums.reduce((sum, album) => sum + countAlbumTracks(album), 0);
            document.getElementById('albumCount').textContent = catalog.albums.length;
            document.getElementById('trackCount').textContent = totalTracks;
            document.getElementById('videoCount').textContent = catalog.clips.length + catalog.shows.length;
            document.querySelectorAll('.section-button[data-section]').forEach(button => {
                const section = button.dataset.section;
                const count = button.querySelector('.section-count');
                if (count) count.textContent = itemsForSection(section).length;
                button.classList.toggle('active', section === currentSection);
            });
        }

        function renderSectionButtons() {
            const isSettings = currentSection === 'settings';
            searchInput.disabled = isSettings;
            addItemButton.disabled = isSettings;
            addItemButton.textContent = isSettings ? 'Adicionar conteúdo' : `Adicionar em ${sectionDefinitions[currentSection].label}`;
        }

        function renderList() {
            itemList.replaceChildren();
            if (currentSection === 'settings') {
                const info = document.createElement('div');
                info.className = 'empty-list';
                info.textContent = 'Configurações gerais do arquivo.';
                itemList.appendChild(info);
                return;
            }
            const query = searchInput.value.trim().toLocaleLowerCase('pt-BR');
            const items = itemsForSection().filter(item => {
                const haystack = `${item.title || ''} ${item.artist || ''} ${item.id || ''}`.toLocaleLowerCase('pt-BR');
                return !query || haystack.includes(query);
            });
            if (!items.length) {
                const empty = document.createElement('div');
                empty.className = 'empty-list';
                empty.textContent = query ? 'Nenhum resultado.' : 'Nenhum conteúdo nesta categoria.';
                itemList.appendChild(empty);
                return;
            }
            items.forEach(item => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `list-item${item === selectedItem ? ' active' : ''}`;
                const title = document.createElement('strong');
                title.textContent = item.title || 'Sem título';
                const subtitle = document.createElement('span');
                subtitle.textContent = `${item.id || 'sem-id'}${item.year ? ` • ${item.year}` : ''}`;
                button.append(title, subtitle);
                button.addEventListener('click', () => {
                    selectedItem = item;
                    renderList();
                    renderEditor();
                });
                itemList.appendChild(button);
            });
        }

        function renderWelcome() {
            workspace.replaceChildren();
            const box = document.createElement('div');
            box.className = 'welcome';
            const title = document.createElement('h2');
            title.textContent = 'Abra o catálogo para começar';
            const text = document.createElement('p');
            text.textContent = 'Quando este editor estiver publicado na mesma pasta do site, ele abrirá catalogo.json automaticamente. No computador, você também pode selecionar o arquivo manualmente.';
            const actions = document.createElement('div');
            actions.className = 'welcome-actions';
            const open = actionButton('Abrir arquivo JSON', 'primary', () => fileInput.click());
            const retry = actionButton('Tentar carregar novamente', '', () => loadCatalogFromSite(false));
            actions.append(open, retry);
            box.append(title, text, actions);
            workspace.appendChild(box);
        }

        function renderEditor() {
            workspace.replaceChildren();
            if (currentSection === 'settings') return renderSettingsEditor();
            if (!selectedItem || !itemsForSection().includes(selectedItem)) {
                selectedItem = itemsForSection()[0] || null;
            }
            if (!selectedItem) return renderEmptyEditor();
            if (sectionDefinitions[currentSection].kind === 'album') renderAlbumEditor(selectedItem);
            else renderMediaEditor(selectedItem);
        }

        function editorShell(title, subtitle) {
            const shell = document.createElement('div');
            shell.className = 'editor-shell';
            const header = document.createElement('div');
            header.className = 'editor-header';
            const copy = document.createElement('div');
            const heading = document.createElement('h2');
            heading.textContent = title;
            const paragraph = document.createElement('p');
            paragraph.textContent = subtitle;
            copy.append(heading, paragraph);
            const actions = document.createElement('div');
            actions.className = 'editor-actions';
            header.append(copy, actions);
            shell.appendChild(header);
            workspace.appendChild(shell);
            return { shell, actions, heading };
        }

        function renderEmptyEditor() {
            const box = document.createElement('div');
            box.className = 'welcome';
            const title = document.createElement('h2');
            title.textContent = `Nenhum conteúdo em ${sectionDefinitions[currentSection].label}`;
            const text = document.createElement('p');
            text.textContent = 'Use o botão abaixo para criar o primeiro item desta categoria.';
            const add = actionButton('Adicionar conteúdo', 'primary', addItem);
            box.append(title, text, add);
            workspace.appendChild(box);
        }

        function renderSettingsEditor() {
            const view = editorShell('Configurações do catálogo', 'Informações gerais usadas pelo aplicativo e pelo site.');
            const panel = createPanel('Dados gerais', 'Mantenha assetBaseUrl terminando com uma barra.');
            const grid = createGrid('field-grid');
            addField(grid, catalog, 'schemaVersion', 'Versão do esquema', { type: 'number' });
            addField(grid, catalog, 'title', 'Título do catálogo');
            addField(grid, catalog, 'artist', 'Artista padrão');
            addField(grid, catalog, 'assetBaseUrl', 'Endereço base dos arquivos', { full: true, path: true });
            addField(grid, catalog, 'assetUrlRule', 'Regra dos caminhos', { full: true, textarea: true });
            panel.body.appendChild(grid);
            view.shell.appendChild(panel.element);
        }

        function renderAlbumEditor(album) {
            const view = editorShell(album.title || 'Álbum sem título', sectionDefinitions[currentSection].label);
            view.actions.append(
                actionButton('Duplicar', '', () => duplicateItem(album)),
                actionButton('Excluir', 'danger', () => deleteCurrentItem())
            );

            const details = createPanel('Informações', 'Os campos terminados em Path são combinados com assetBaseUrl.');
            const grid = createGrid('field-grid');
            addField(grid, album, 'id', 'ID único');
            addField(grid, album, 'category', 'Categoria', {
                select: [
                    ['main', 'Álbum'],
                    ['compilation', 'Compilação'],
                    ['unreleased', 'Música não lançada']
                ],
                onChange: value => {
                    album.category = value;
                    currentSection = value;
                    markDirty();
                    renderAll();
                }
            });
            addField(grid, album, 'title', 'Título', { onInput: () => { view.heading.textContent = album.title || 'Álbum sem título'; renderList(); } });
            addField(grid, album, 'artist', 'Artista');
            addField(grid, album, 'year', 'Ano');
            addField(grid, album, 'genre', 'Gênero');
            addField(grid, album, 'coverPath', 'Caminho da capa', { full: true, path: true });
            addField(grid, album, 'animatedCoverPath', 'Caminho da capa animada', { full: true, path: true });
            addField(grid, album, 'backgroundPath', 'Caminho do fundo', { full: true, path: true });
            details.body.appendChild(grid);
            view.shell.appendChild(details.element);

            renderTracksPanel(view.shell, album, 'tracks', 'Faixas do álbum');
            renderVersionsPanel(view.shell, album);
        }

        function renderMediaEditor(item) {
            const singular = currentSection === 'clips' ? 'clipe' : 'show';
            const view = editorShell(item.title || `${singular} sem título`, sectionDefinitions[currentSection].label);
            view.actions.append(
                actionButton('Duplicar', '', () => duplicateItem(item)),
                actionButton('Excluir', 'danger', () => deleteCurrentItem())
            );
            const details = createPanel('Informações', `Dados exibidos na tela de detalhes do ${singular}.`);
            const grid = createGrid('field-grid');
            addField(grid, item, 'id', 'ID único');
            addField(grid, item, 'title', 'Título', { onInput: () => { view.heading.textContent = item.title || `${singular} sem título`; renderList(); } });
            addField(grid, item, 'artist', 'Cantora ou artista');
            addField(grid, item, 'year', 'Ano');
            addField(grid, item, 'duration', 'Duração', { placeholder: '01:32:15 ou 04:20' });
            addField(grid, item, 'description', 'Descrição', { full: true, textarea: true });
            addField(grid, item, 'videoPath', 'Caminho do vídeo', { full: true, path: true });
            addField(grid, item, 'thumbnailPath', 'Caminho da miniatura do card', { full: true, path: true });
            addField(grid, item, 'backgroundPath', 'Caminho da imagem de fundo', { full: true, path: true });
            addField(grid, item, 'logoPath', 'Caminho do logo (opcional)', { full: true, path: true });
            details.body.appendChild(grid);
            view.shell.appendChild(details.element);
        }

        function createPanel(title, description) {
            const element = document.createElement('section');
            element.className = 'panel';
            const heading = document.createElement('div');
            heading.className = 'panel-heading';
            const copy = document.createElement('div');
            const h3 = document.createElement('h3');
            h3.textContent = title;
            copy.appendChild(h3);
            if (description) {
                const p = document.createElement('p');
                p.textContent = description;
                copy.appendChild(p);
            }
            const actions = document.createElement('div');
            actions.className = 'editor-actions';
            heading.append(copy, actions);
            const body = document.createElement('div');
            element.append(heading, body);
            return { element, heading, actions, body };
        }

        function createGrid(className) {
            const grid = document.createElement('div');
            grid.className = className;
            return grid;
        }

        function addField(parent, object, key, labelText, options = {}) {
            const wrapper = document.createElement('div');
            wrapper.className = `field${options.full ? ' full' : ''}`;
            const label = document.createElement('label');
            const controlId = `field-${Math.random().toString(36).slice(2)}`;
            label.htmlFor = controlId;
            label.textContent = labelText;
            let control;
            if (options.select) {
                control = document.createElement('select');
                options.select.forEach(([value, text]) => {
                    const option = document.createElement('option');
                    option.value = value;
                    option.textContent = text;
                    control.appendChild(option);
                });
            } else if (options.textarea) {
                control = document.createElement('textarea');
            } else {
                control = document.createElement('input');
                control.type = options.type || 'text';
            }
            control.id = controlId;
            control.value = object[key] == null ? '' : object[key];
            if (options.placeholder) control.placeholder = options.placeholder;
            if (options.path) control.classList.add('path-input');
            control.addEventListener('input', () => {
                if (options.type === 'number') object[key] = Number(control.value || 0);
                else object[key] = control.value;
                markDirty();
                if (options.onInput) options.onInput(control.value);
            });
            control.addEventListener('change', () => {
                if (options.path) {
                    control.value = normalizePath(control.value);
                    object[key] = control.value;
                }
                if (options.onChange) options.onChange(control.value);
                else markDirty();
            });
            wrapper.append(label, control);
            if (options.path) {
                const hint = document.createElement('small');
                hint.textContent = 'Use / entre as pastas. Espaços serão convertidos para %20 ao baixar.';
                wrapper.appendChild(hint);
            }
            parent.appendChild(wrapper);
            return control;
        }

        function actionButton(label, style, handler) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = `button small ${style || ''}`.trim();
            button.textContent = label;
            button.addEventListener('click', handler);
            return button;
        }

        function renderTracksPanel(parent, owner, key, title) {
            if (!Array.isArray(owner[key])) owner[key] = [];
            const tracks = owner[key];
            const panel = createPanel(title, `${tracks.length} faixa(s).`);
            panel.actions.appendChild(actionButton('Adicionar faixa', 'primary', () => {
                tracks.push({ number: String(tracks.length + 1), title: 'Nova faixa', audioPath: '' });
                markDirty();
                renderEditor();
                renderCounts();
            }));

            if (!tracks.length) {
                const empty = document.createElement('div');
                empty.className = 'collection-empty';
                empty.textContent = 'Nenhuma faixa cadastrada.';
                panel.body.appendChild(empty);
            }

            tracks.forEach((track, index) => {
                const details = document.createElement('details');
                details.className = 'collection-item';
                const summary = document.createElement('summary');
                const copy = document.createElement('span');
                copy.className = 'summary-copy';
                const refreshSummary = () => copy.textContent = `${track.number || index + 1} — ${track.title || 'Faixa sem título'}`;
                refreshSummary();
                const actions = document.createElement('span');
                actions.className = 'row-actions';
                actions.append(
                    compactButton('↑', 'Mover faixa para cima', event => moveArrayItem(tracks, index, -1, event)),
                    compactButton('↓', 'Mover faixa para baixo', event => moveArrayItem(tracks, index, 1, event)),
                    compactButton('Excluir', 'Excluir faixa', event => {
                        event.preventDefault(); event.stopPropagation();
                        if (!window.confirm(`Excluir a faixa “${track.title || 'sem título'}”?`)) return;
                        tracks.splice(index, 1); markDirty(); renderEditor(); renderCounts();
                    }, true)
                );
                summary.append(copy, actions);
                const body = document.createElement('div');
                body.className = 'collection-body';
                const grid = createGrid('field-grid three');
                addField(grid, track, 'number', 'Número', { onInput: refreshSummary });
                addField(grid, track, 'disc', 'Disco');
                addField(grid, track, 'duration', 'Duração');
                addField(grid, track, 'title', 'Nome da faixa', { full: true, onInput: refreshSummary });
                addField(grid, track, 'audioPath', 'Caminho do áudio', { full: true, path: true });
                body.appendChild(grid);
                details.append(summary, body);
                panel.body.appendChild(details);
            });
            parent.appendChild(panel.element);
        }

        function renderVersionsPanel(parent, album) {
            if (!Array.isArray(album.versions)) album.versions = [];
            const versions = album.versions;
            const panel = createPanel('Versões do álbum', 'Use para edições padrão, deluxe ou comemorativas.');
            panel.actions.appendChild(actionButton('Adicionar versão', '', () => {
                versions.push({
                    id: uniqueId(`${album.id || 'album'}-versao`),
                    title: `${album.title || 'Álbum'} — nova versão`,
                    year: album.year || '',
                    genre: album.genre || 'Pop',
                    coverPath: album.coverPath || '',
                    animatedCoverPath: album.animatedCoverPath || '',
                    tracks: []
                });
                markDirty(); renderEditor();
            }));
            if (!versions.length) {
                const empty = document.createElement('div');
                empty.className = 'collection-empty';
                empty.textContent = 'Este álbum não possui versões separadas.';
                panel.body.appendChild(empty);
            }
            versions.forEach((version, index) => {
                if (!Array.isArray(version.tracks)) version.tracks = [];
                const details = document.createElement('details');
                details.className = 'collection-item';
                const summary = document.createElement('summary');
                const copy = document.createElement('span');
                copy.className = 'summary-copy';
                const refreshSummary = () => copy.textContent = `${version.title || 'Versão sem título'} • ${version.tracks.length} faixa(s)`;
                refreshSummary();
                const actions = document.createElement('span');
                actions.className = 'row-actions';
                actions.append(
                    compactButton('↑', 'Mover versão para cima', event => moveArrayItem(versions, index, -1, event)),
                    compactButton('↓', 'Mover versão para baixo', event => moveArrayItem(versions, index, 1, event)),
                    compactButton('Excluir', 'Excluir versão', event => {
                        event.preventDefault(); event.stopPropagation();
                        if (!window.confirm(`Excluir a versão “${version.title || 'sem título'}” e suas faixas?`)) return;
                        versions.splice(index, 1); markDirty(); renderEditor(); renderCounts();
                    }, true)
                );
                summary.append(copy, actions);
                const body = document.createElement('div');
                body.className = 'collection-body';
                const grid = createGrid('field-grid');
                addField(grid, version, 'id', 'ID da versão');
                addField(grid, version, 'title', 'Título da versão', { onInput: refreshSummary });
                addField(grid, version, 'year', 'Ano');
                addField(grid, version, 'genre', 'Gênero');
                addField(grid, version, 'coverPath', 'Caminho da capa', { full: true, path: true });
                addField(grid, version, 'animatedCoverPath', 'Caminho da capa animada', { full: true, path: true });
                body.appendChild(grid);
                renderTracksPanel(body, version, 'tracks', 'Faixas desta versão');
                details.append(summary, body);
                panel.body.appendChild(details);
            });
            parent.appendChild(panel.element);
        }

        function compactButton(label, ariaLabel, handler, danger = false) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = `button small icon${danger ? ' danger' : ''}`;
            button.textContent = label;
            button.setAttribute('aria-label', ariaLabel);
            button.addEventListener('click', handler);
            return button;
        }

        function moveArrayItem(array, index, direction, event) {
            event.preventDefault(); event.stopPropagation();
            const destination = index + direction;
            if (destination < 0 || destination >= array.length) return;
            [array[index], array[destination]] = [array[destination], array[index]];
            markDirty(); renderEditor();
        }

        function addItem() {
            if (currentSection === 'settings') return;
            let item;
            if (sectionDefinitions[currentSection].kind === 'album') {
                const label = currentSection === 'compilation' ? 'Nova compilação' : currentSection === 'unreleased' ? 'Músicas não lançadas' : 'Novo álbum';
                item = {
                    id: uniqueId(label),
                    title: label,
                    artist: catalog.artist || 'Britney Spears',
                    year: '',
                    genre: 'Pop',
                    category: sectionDefinitions[currentSection].category,
                    coverPath: '',
                    animatedCoverPath: '',
                    backgroundPath: '',
                    tracks: []
                };
                catalog.albums.push(item);
            } else {
                const isClip = currentSection === 'clips';
                item = {
                    id: uniqueId(isClip ? 'novo-clipe' : 'novo-show'),
                    title: isClip ? 'Novo clipe' : 'Novo show',
                    artist: catalog.artist || 'Britney Spears',
                    year: '', duration: '', description: '',
                    videoPath: '', thumbnailPath: '', backgroundPath: '', logoPath: ''
                };
                catalog[currentSection].push(item);
            }
            selectedItem = item;
            searchInput.value = '';
            markDirty(); renderAll();
        }

        function duplicateItem(item) {
            const copy = JSON.parse(JSON.stringify(item));
            copy.id = uniqueId(`${item.id || item.title || 'item'}-copia`);
            copy.title = `${item.title || 'Item'} — cópia`;
            if (sectionDefinitions[currentSection].kind === 'album') catalog.albums.push(copy);
            else catalog[currentSection].push(copy);
            selectedItem = copy;
            markDirty(); renderAll();
        }

        function deleteCurrentItem() {
            if (!selectedItem) return;
            if (!window.confirm(`Excluir “${selectedItem.title || selectedItem.id || 'este item'}” do catálogo?`)) return;
            const array = sectionDefinitions[currentSection].kind === 'album' ? catalog.albums : catalog[currentSection];
            const index = array.indexOf(selectedItem);
            if (index >= 0) array.splice(index, 1);
            selectedItem = itemsForSection()[0] || null;
            markDirty(); renderAll();
        }

        function validateCatalog() {
            const errors = [];
            const warnings = [];
            const ids = new Map();
            const addId = (item, location) => {
                if (!item.id) errors.push(`${location}: ID vazio.`);
                else if (ids.has(item.id)) errors.push(`ID repetido “${item.id}” em ${ids.get(item.id)} e ${location}.`);
                else ids.set(item.id, location);
                if (!item.title) errors.push(`${location}: título vazio.`);
            };
            const validatePath = (value, location, required = true) => {
                if (!value) {
                    if (required) warnings.push(`${location}: caminho vazio.`);
                    return;
                }
                if (value.includes('\\')) errors.push(`${location}: use / em vez de \\.`);
                if (value.includes(' ')) warnings.push(`${location}: contém espaços; eles serão convertidos para %20 no download.`);
            };
            catalog.albums.forEach((album, albumIndex) => {
                const place = `Álbum ${albumIndex + 1}`;
                addId(album, place);
                if (!['main', 'compilation', 'official-compilations', 'unreleased', 'unreleased-music', 'musicas-nao-lancadas'].includes(String(album.category || 'main').toLowerCase())) warnings.push(`${place}: categoria “${album.category}” será tratada como álbum principal.`);
                validatePath(album.coverPath, `${place} / capa`, false);
                const validateTracks = (tracks, owner) => (tracks || []).forEach((track, index) => {
                    if (!track.title) warnings.push(`${owner} / faixa ${index + 1}: título vazio.`);
                    validatePath(track.audioPath || track.audioUrl, `${owner} / faixa ${index + 1} / áudio`);
                });
                validateTracks(album.tracks, place);
                (album.versions || []).forEach((version, versionIndex) => {
                    if (!version.id) warnings.push(`${place} / versão ${versionIndex + 1}: ID vazio.`);
                    if (!version.title) warnings.push(`${place} / versão ${versionIndex + 1}: título vazio.`);
                    validateTracks(version.tracks, `${place} / versão ${versionIndex + 1}`);
                });
            });
            ['clips', 'shows'].forEach(section => catalog[section].forEach((item, index) => {
                const place = `${section === 'clips' ? 'Clipe' : 'Show'} ${index + 1}`;
                addId(item, place);
                validatePath(item.videoPath || item.videoUrl, `${place} / vídeo`);
                validatePath(item.thumbnailPath || item.thumbnailUrl, `${place} / miniatura`, false);
                validatePath(item.backgroundPath || item.backgroundUrl, `${place} / fundo`, false);
                validatePath(item.logoPath || item.logoUrl, `${place} / logo`, false);
            }));
            showValidation(errors, warnings);
            return errors.length === 0;
        }

        function showValidation(errors, warnings) {
            const view = editorShell('Validação do catálogo', `${errors.length} erro(s) e ${warnings.length} aviso(s).`);
            const panel = createPanel(errors.length ? 'O catálogo precisa de correções' : 'Estrutura compatível', 'A verificação analisa campos, IDs e formato dos caminhos.');
            const list = document.createElement('ul');
            list.className = 'validation-list';
            if (!errors.length && !warnings.length) {
                const item = document.createElement('li');
                item.className = 'validation-ok';
                item.textContent = 'Nenhum problema encontrado.';
                list.appendChild(item);
            }
            errors.forEach(message => {
                const item = document.createElement('li');
                item.className = 'validation-error'; item.textContent = message; list.appendChild(item);
            });
            warnings.forEach(message => {
                const item = document.createElement('li');
                item.className = 'validation-warning'; item.textContent = message; list.appendChild(item);
            });
            panel.body.appendChild(list);
            view.shell.appendChild(panel.element);
            setStatus(errors.length ? 'Validação concluída com erros.' : 'Validação concluída.', errors.length ? 'error' : 'success');
        }

        function formatCatalog() {
            return JSON.stringify(normalizedExportCatalog(), null, 2) + '\n';
        }

        function downloadCatalog() {
            if (!validateCatalog()) {
                if (!window.confirm('Existem erros no catálogo. Deseja baixar mesmo assim?')) return;
            }
            const content = formatCatalog();
            const blob = new Blob([content], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'catalogo.json';
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            clearDirty();
            setStatus('catalogo.json gerado. Substitua o arquivo no repositório e faça o commit.', 'success');
        }

        function showPreview() {
            jsonPreview.value = formatCatalog();
            previewDialog.showModal();
        }

        document.querySelectorAll('.section-button[data-section]').forEach(button => {
            button.addEventListener('click', () => {
                currentSection = button.dataset.section;
                selectedItem = itemsForSection()[0] || null;
                searchInput.value = '';
                renderAll();
            });
        });
        searchInput.addEventListener('input', renderList);
        addItemButton.addEventListener('click', addItem);
        document.getElementById('loadSiteButton').addEventListener('click', () => loadCatalogFromSite(true));
        document.getElementById('openFileButton').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => { loadCatalogFile(fileInput.files[0]); fileInput.value = ''; });
        document.getElementById('validateButton').addEventListener('click', validateCatalog);
        document.getElementById('previewButton').addEventListener('click', showPreview);
        document.getElementById('downloadButton').addEventListener('click', downloadCatalog);
        document.getElementById('downloadPreviewButton').addEventListener('click', downloadCatalog);
        document.getElementById('closePreviewButton').addEventListener('click', () => previewDialog.close());
        document.getElementById('copyPreviewButton').addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(jsonPreview.value);
                setStatus('JSON copiado para a área de transferência.', 'success');
            } catch (error) {
                jsonPreview.select();
                document.execCommand('copy');
                setStatus('JSON copiado.', 'success');
            }
        });
        document.addEventListener('dragover', event => event.preventDefault());
        document.addEventListener('drop', event => {
            event.preventDefault();
            const file = [...event.dataTransfer.files].find(item => item.name.toLowerCase().endsWith('.json'));
            if (file) loadCatalogFile(file);
        });
        window.addEventListener('beforeunload', event => {
            if (!dirty) return;
            event.preventDefault();
            event.returnValue = '';
        });

        loadCatalogFromSite(false);
    </script>
</body>
</html>
