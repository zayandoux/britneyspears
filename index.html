<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Acervo Britney Spears</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{color-scheme:dark;--bg:#17121b;--panel:#231d29;--text:#fff7fa;--muted:#c4b5c5;--line:#493b4c;--pink:#ffaccb}
body.light{color-scheme:light;--bg:#fcf7fa;--panel:white;--text:#33232e;--muted:#675966;--line:#dccfd5;--pink:#922b52}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,sans-serif}
header,main{max-width:1200px;margin:auto;padding:18px clamp(16px,4vw,54px)}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}main{padding-bottom:160px}
.brand{font:italic bold 25px Georgia;color:inherit;text-decoration:none}
button,input,select{font:inherit}button,select,input[type=search]{min-height:44px;border:1px solid var(--line);padding:9px 14px;border-radius:10px;background:var(--panel);color:var(--text)}button{cursor:pointer}button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
h1{font:normal clamp(36px,6vw,72px)/1.04 Georgia,serif;letter-spacing:-.04em;margin:10px 0 16px}h2{font-size:22px;margin:28px 0 12px}p{margin:8px 0}
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:220px;display:flex;align-items:end;background:linear-gradient(115deg,#47243e,#a44b70);color:white;border-radius:18px;padding:clamp(22px,5vw,60px)}.hero h1{max-width:70%;text-shadow:0 2px 18px #382235}.hero:after{content:'';position:absolute;z-index:-1;right:-3%;top:-20%;width:clamp(210px,36vw,420px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#432035 0 3%,#efa8c3 3.2% 16%,transparent 16.2%),repeating-radial-gradient(circle,#321d2e 0 2px,#5c3e4c 3px 4px);box-shadow:-12px 12px 40px #351a2a80}
.tiles,.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:15px}.tile,.card{color:inherit;text-decoration:none;min-width:0}.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;display:grid;gap:14px}.tile i{color:var(--pink);font:normal 26px Georgia}.tile strong,.card strong{display:block}.tile:hover,.card:hover strong{color:var(--pink)}small,.meta,.status{color:var(--muted)}.status:empty{display:none}
.art{background:linear-gradient(135deg,#783f5d,#322137);border-radius:12px;aspect-ratio:1;display:grid;place-items:center;position:relative;overflow:hidden;font:italic 32px Georgia;color:#f2cddd}.art.wide{aspect-ratio:16/10}.art img,.art video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.card strong{margin-top:8px}.crumb{display:inline-block;color:var(--pink);padding:8px 0 16px}
.detail{display:grid;grid-template-columns:minmax(150px,32%) 1fr;gap:26px;align-items:center}.row{width:100%;text-align:left;display:flex;align-items:center;gap:12px;border-radius:0;border-width:0 0 1px;background:transparent;padding:13px 4px}.row span:first-child{color:var(--pink);min-width:2em}.row span:nth-child(2){flex:1}.current{color:var(--pink);font-weight:700}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}#player{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));right:max(12px,calc((100vw - 1120px)/2));z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 42px #0008;padding:12px;width:min(490px,calc(100% - 24px));max-height:75dvh;overflow:auto}#player .tools{margin:0}#now{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}#panel{padding-top:12px}#panel audio,#film{width:100%}#film{max-height:38dvh;background:black}#playerArt{width:min(180px,38vw);margin:auto}button[aria-pressed=true]{color:var(--pink)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;width:min(400px,92vw)}dialog::backdrop{background:#0009}dialog label{display:block;margin:16px 0}input[type=file]{max-width:100%}
@media(max-width:640px){header{padding-block:12px}.tiles,.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.hero{min-height:160px}.hero:after{right:-17%}.detail{grid-template-columns:1fr;gap:12px}.detail .art{width:min(285px,100%);margin:auto}}
</style></head><body><header><a href="#" class="brand">Britney Spears</a><button id="optionsBtn">Opções</button></header><main></main>
<aside id="player" aria-label="Reprodutor" hidden><div class="tools"><strong id="now"></strong><button id="toggle">Reproduzir</button><button id="expand" aria-expanded="false">Expandir</button></div><div id="panel" hidden><div id="playerArt"></div><audio controls></audio><video id="film" controls playsinline hidden></video><div class="tools"><button id="prev">Anterior</button><button id="next">Próxima</button><button id="shuffle" aria-pressed="false">Aleatório</button><select id="repeat" aria-label="Repetição"><option>Sem repetir</option><option>Repetir faixa</option><option>Repetir lista</option></select></div></div><p id="problem" class="status" role="status"></p></aside>
<dialog><h2>Opções</h2><label><input type="checkbox" id="light"> Modo claro</label><label>Abrir catálogo JSON <input type="file" accept=".json,application/json" id="file"></label><button id="close">Fechar</button></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s);
const sections=[
 ['musicas','Músicas','♫',['albums','musicas','music','discography']],
 ['videoclipes','Videoclipes','▷',['musicVideos','videoClips','clips','videos','videoclipes']],
 ['shows','Shows','✦',['concerts','shows','liveShows','tours']],
 ['especiais','Especiais','✧',['specials','especiais','tvSpecials']],
 ['playlists','Playlists','≡',['playlists','playlist']]
];
const appleRoot='https://mvod.itunes.apple.com/itunes-assets/HLSVideo221/v4/ac/98/a8/ac98a855-1024-baa2-f0ab-2ef4ca72fc42/P1542761448_';
const anniversaryMp4=appleRoot+'Anull_video_gr240_sdr_768x768-.mp4',anniversaryHls=appleRoot+'default.m3u8';
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function url(p,base){if(typeof p!=='string'||!p.trim())return '';try{const u=new URL(p,base);return ['http:','https:','file:'].includes(u.protocol)?u.href:''}catch{return ''}}
function el(tag,text,cls){const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n}
function link(text,href,cls){const a=el('a',text,cls);a.href=href;return a}
function normalize(raw,origin){
 if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('O JSON precisa conter um objeto de catálogo.');
 const data=raw.catalog||raw.catalogo||raw,base=data.assetBaseUrl||raw.assetBaseUrl;
 const asset=p=>url(p,base?url(String(base).replace(/\/?$/,'/'),origin):origin);
 const result={},refs=new Map(),scoped=new Map();
 const names=Object.assign(Object.create(null),{main:'Álbuns de estúdio','official-compilations':'Compilações oficiais','albums-remixes':'Álbuns de remixes','unreleased-music':'Músicas não lançadas'});
 for(const c of Array.isArray(data.musicCategories)?data.musicCategories:[])names[c.id]=c.title;
 const childKeys=['items','entries','tracks','songs','faixas','episodes','segments','parts','chapters','videos','clips','trackIds','videoIds'];
 function register(map,k,t){if(k==null)return;k=String(k);if(!map.has(k))map.set(k,t);else if(map.get(k)!==t)map.set(k,null)}
 function source(o){return o.videoPath||o.videoUrl||o.audioPath||o.audioUrl||o.mediaPath||o.mediaUrl||o.streamUrl||o.playbackUrl||o.url||o.src||o.file}
 for(const [kind,,,aliases] of sections){
  const list=result[kind]=[];
  function add(o,group=''){
   if(!o||typeof o!=='object')return;
   const nested=['albums','categories','specials','concerts','shows','musicVideos','playlists'].find(k=>Array.isArray(o[k]));
   if(nested){o[nested].forEach(v=>add(v,o.title||o.name||group));return}
   const item={title:o.title||o.name||'Sem título',artist:o.artist||'Britney Spears',year:o.year,desc:o.description||o.synopsis,category:group||o.category||(kind==='musicas'?'main':''),cover:asset(o.coverPath||o.coverUrl||o.thumbnailPath||o.thumbnailUrl||o.posterPath||o.cover||o.thumbnail),anim:asset(o.animatedCoverPath||o.animatedCoverUrl)};
   if(kind==='musicas'&&((/britney/i.test(item.title)&&/25(th)?\s*(anniversary|anivers[aá]rio|anos)|25th/i.test(item.title))||String(o.id)==='6818422876')){
    if(!item.anim||new URL(item.anim).hostname==='music.apple.com'||item.anim===anniversaryHls)item.anim=anniversaryMp4;
    item.backup=item.anim===anniversaryMp4?anniversaryHls:anniversaryMp4;
   }
   const child=childKeys.find(k=>Array.isArray(o[k])),rows=child?o[child]:source(o)?[o]:[];
   item.tracks=rows.map(t=>{
    if(typeof t!=='object'||!t)return {ref:t};
    const src=asset(source(t)),entry={src,title:t.title||t.name||item.title,artist:t.artist||item.artist,number:t.number,disc:t.disc,duration:t.duration,album:item,ref:t.trackId??t.videoId??t.itemId??t.ref??t.id,albumId:t.albumId,video:!!(t.videoPath||t.videoUrl||t.type==='video'||/\.(mp4|webm|mov)(?:[?#]|$)/i.test(src)||(!t.audioPath&&!t.audioUrl&&['shows','especiais','videoclipes'].includes(kind)))};
    if(src&&kind!=='playlists'){register(refs,t.id,entry);if(o.id!=null&&t.id!=null)register(scoped,JSON.stringify([String(o.id),String(t.id)]),entry)}
    return entry
   });
   if(kind!=='playlists'&&rows.length===1&&item.tracks[0].src)register(refs,o.id,item.tracks[0]);
   list.push(item)
  }
  for(const [key,v] of Object.entries(data)){
   if(!aliases.some(a=>norm(a)===norm(key)))continue;
   if(Array.isArray(v))v.forEach(o=>add(o));else if(v&&typeof v==='object'){
    if(v.title||v.name||v.albums||childKeys.some(k=>Array.isArray(v[k])))add(v);
    else for(const [g,rows] of Object.entries(v))if(Array.isArray(rows))rows.forEach(o=>add(o,g))
   }
  }
 }
 for(const p of result.playlists)p.tracks=p.tracks.map(t=>t.src?t:(t.albumId==null?refs.get(String(t.ref)):scoped.get(JSON.stringify([String(t.albumId),String(t.ref)])))||{...t,title:t.title||String(t.ref??'Item sem referência')});
 return {result,names}
}
const engines=new WeakMap();
let hlsReady;
function hls(){if(!hlsReady)hlsReady=new Promise((ok,fail)=>{const script=el('script');script.src='https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js';script.onload=()=>ok(window.Hls);script.onerror=()=>{hlsReady=null;fail(Error('Falha ao carregar o suporte a HLS.'))};document.head.append(script)});return hlsReady}
function release(v){engines.get(v)?.destroy();engines.delete(v);v.pause();v.removeAttribute('src');v.load()}
async function attach(v,src,active,fail){
 if(new URL(src).hostname==='music.apple.com')throw Error('Informe o endereço direto do vídeo da capa.');
 if(/\.m3u8(?:[?#]|$)/i.test(src)&&!v.canPlayType('application/vnd.apple.mpegurl')){
  const Hls=await hls();if(!active())return;if(!Hls?.isSupported())throw Error('Este navegador não oferece suporte a HLS.');
  const h=new Hls();engines.set(v,h);h.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal&&active())fail('Erro de HLS: '+d.details)});h.loadSource(src);h.attachMedia(v)
 }else v.src=src;
}
function art(item,wide){const box=el('div','BS','art'+(wide?' wide':''));if(item.cover){const im=el('img');im.alt='';im.loading='lazy';im.onerror=()=>im.remove();im.src=item.cover;box.append(im)}return box}
function animate(item,host){
 if(!item.anim)return ()=>{};
 const box=host.querySelector('.art'),note=el('small',null,'status');host.append(note);
 let active=true,version=0,v;
 function attempt(src,backup){
  const id=++version;if(v){v.onerror=null;release(v);v.remove()}
  v=el('video');v.muted=true;v.defaultMuted=true;v.loop=true;v.playsInline=true;v.style.opacity=0;box.append(v);
  const current=()=>active&&id===version;
  const fail=()=>{if(!current())return;if(backup){attempt(backup,'');return}v.style.opacity=0;note.textContent='Capa animada indisponível. Verifique o endereço da mídia.'};
  v.onplaying=()=>{if(current()){v.style.opacity=1;note.replaceChildren()}};
  v.onerror=fail;
  const start=()=>v.play().catch(e=>{if(!current()||e.name==='AbortError')return;if(e.name==='NotAllowedError'){const b=el('button','Animar capa');b.onclick=start;note.replaceChildren(b)}else fail()});
  attach(v,src,current,fail).then(()=>{if(current())start()}).catch(fail)
 }
 attempt(item.anim,item.backup);
 return ()=>{active=false;v.onerror=null;release(v);v.remove()}
}
let library={},names={},message='Carregando catálogo…',loadVersion=0,detailCleanup=()=>{},playerCleanup=()=>{};
let queue=[],idx=0,media=$('audio'),playVersion=0,shuffle=false;
function highlight(){for(const b of document.querySelectorAll('.row'))b.classList.toggle('current',b.entry===queue[idx]&&!media.paused)}
function draw(){
 detailCleanup();detailCleanup=()=>{};const main=$('main');main.replaceChildren();
 const [key,id]=location.hash.slice(1).split('/'),section=sections.find(s=>s[0]===key);
 const status=el('p',message,'status');status.setAttribute('role','status');
 if(!section){const hero=el('div',null,'hero');hero.append(el('h1','Acervo Britney Spears'));main.append(hero,el('h2','Explorar o acervo'),status);
  const nav=el('nav',null,'tiles');for(const [k,title,icon] of sections){const a=link('','#'+k,'tile'),txt=el('div'),mark=el('i',icon);mark.setAttribute('aria-hidden','true');txt.append(el('strong',title),el('small',library[k]?library[k].length+' no catálogo':'Abrir seção'));a.append(mark,txt);nav.append(a)}main.append(nav);return}
 const items=library[key]||[],item=/^\d+$/.test(id??'')?items[Number(id)]:null;main.append(link(item?'‹ '+section[1]:'‹ Início',item?'#'+key:'#','crumb'));
 if(!item){main.append(el('h1',section[1]),status);if(!items.length){main.append(el('p','Nenhum item disponível nesta seção.','meta'));return}
  const search=el('input');search.type='search';search.placeholder='Buscar em '+section[1].toLowerCase();search.setAttribute('aria-label',search.placeholder);const bar=el('div',null,'tools'),results=el('div');bar.append(search);main.append(bar,results);
  function filter(){results.replaceChildren();const buckets=new Map();items.forEach((it,i)=>{if(!norm([it.title,it.artist,...it.tracks.map(t=>t.title)].join(' ')).includes(norm(search.value)))return;
   if(!buckets.has(it.category)){if(it.category)results.append(el('h2',names[it.category]||String(it.category).replace(/[-_]/g,' ')));const grid=el('div',null,'grid');results.append(grid);buckets.set(it.category,grid)}
   const a=link('','#'+key+'/'+i,'card');a.append(art(it,!['musicas','playlists'].includes(key)),el('strong',it.title),el('small',it.year||it.artist));buckets.get(it.category).append(a)
  });if(!buckets.size)results.append(el('p','Nenhum resultado.'))}search.oninput=filter;filter();return
 }
 const head=el('div',null,'detail'),visual=el('div'),info=el('div');visual.append(art(item));info.append(el('h1',item.title),el('p',[item.artist,item.year].filter(Boolean).join(' · '),'meta'));if(item.desc)info.append(el('p',item.desc));
 const playable=item.tracks.filter(t=>t.src),start=el('button','▶ Reproduzir');start.disabled=!playable.length;start.onclick=()=>play(playable,0);info.append(start);head.append(visual,info);main.append(head);detailCleanup=animate(item,visual);
 main.append(el('h2',key==='musicas'?'Faixas':'Conteúdo'));if(!item.tracks.length)main.append(el('p','Este item está sem mídia no catálogo.'));
 let disc='';item.tracks.forEach((t,i)=>{if(t.disc&&t.disc!==disc){disc=t.disc;main.append(el('h3',disc))}const b=el('button',null,'row');b.entry=t;b.disabled=!t.src;b.append(el('span',t.number||i+1),el('span',t.title||'Sem título'),el('small',t.src?t.duration||'▷':'Indisponível'));b.onclick=()=>play(playable,playable.indexOf(t));main.append(b)});highlight()
}
function renderPlayerArt(){playerCleanup();playerCleanup=()=>{};const host=$('#playerArt'),t=queue[idx];host.replaceChildren();host.hidden=!t||t.video||$('#panel').hidden;if(host.hidden)return;host.append(art(t.album));playerCleanup=animate(t.album,host)}
function expand(open){$('#panel').hidden=!open;$('#expand').textContent=open?'Recolher':'Expandir';$('#expand').setAttribute('aria-expanded',String(open));renderPlayerArt()}
function sync(){$('#toggle').textContent=media.paused?'Reproduzir':'Pausar';highlight()}
async function play(list,i){const t=list[i];if(!t)return;const g=++playVersion;release(media);queue=list;idx=i;media=t.video?$('#film'):$('audio');$('#film').hidden=!t.video;$('audio').hidden=t.video;$('#player').hidden=false;$('#now').textContent=t.title;$('#problem').textContent='';if(t.video)expand(true);else renderPlayerArt();
 const current=()=>g===playVersion;const fail=m=>{if(current())$('#problem').textContent=m};try{await attach(media,t.src,current,fail);if(current())await media.play()}catch(e){if(e.name!=='AbortError')fail(e.name==='NotAllowedError'?'Toque em Reproduzir para começar.':e.message)}sync()}
function next(auto){if(!queue.length)return;const mode=$('#repeat').selectedIndex;if(auto&&mode===1)return play(queue,idx);if(shuffle&&queue.length>1)return play(queue,(idx+1+Math.floor(Math.random()*(queue.length-1)))%queue.length);if(idx+1<queue.length)return play(queue,idx+1);if(!auto||mode===2)return play(queue,0);sync()}
for(const v of [$('audio'),$('#film')]){v.onplay=v.onpause=sync;v.onended=()=>{if(v===media)next(true)};v.onerror=()=>{if(v===media&&v.error)$('#problem').textContent='Não foi possível reproduzir esta mídia. Confira o endereço e o formato.'}}
$('#prev').onclick=()=>play(queue,(idx+queue.length-1)%queue.length);$('#next').onclick=()=>next(false);$('#toggle').onclick=()=>{if(!media.paused)media.pause();else if(media.error||!media.currentSrc)play(queue,idx);else media.play().catch(e=>$('#problem').textContent=e.message)};
$('#shuffle').onclick=()=>{shuffle=!shuffle;$('#shuffle').setAttribute('aria-pressed',String(shuffle))};$('#expand').onclick=()=>expand($('#panel').hidden);
$('#optionsBtn').onclick=()=>$('dialog').showModal();$('#close').onclick=()=>$('dialog').close();
function theme(light){document.body.classList.toggle('light',light);$('#light').checked=light}try{theme(localStorage.getItem('theme')==='light')}catch{}$('#light').onchange=e=>{theme(e.target.checked);try{localStorage.setItem('theme',e.target.checked?'light':'dark')}catch{}};
async function load(file){const g=++loadVersion;try{let raw,base=new URL('.',location.href).href;if(file)raw=JSON.parse(await file.text());else{const r=await fetch(new URL('catalogo.json',base),{cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status);raw=await r.json();base=new URL('.',r.url).href}
 const parsed=normalize(raw,base);if(g!==loadVersion)return;library=parsed.result;names=parsed.names;message=Object.values(library).some(a=>a.length)?'':'Nenhuma coleção reconhecida neste JSON.';if(file){++playVersion;release(media);queue=[];renderPlayerArt();$('#player').hidden=true;location.hash=''}
 }catch(e){if(g!==loadVersion)return;message='Não foi possível abrir o catálogo. Use Opções → Abrir catálogo JSON. '+(file?e.message:'')}draw()}
$('#file').onchange=e=>{const file=e.target.files[0];if(file){$('dialog').close();load(file)}e.target.value=''};
window.onhashchange=()=>{if(!$('#panel').hidden)expand(false);draw();window.scrollTo(0,0)};draw();load()
</script></body></html>
