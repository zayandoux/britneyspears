<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Acervo Britney Spears</title>
    <style>
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      :root {
        color-scheme: dark;
        --bg: #17121b;
        --panel: #231d29;
        --text: #fff7fa;
        --muted: #c4b5c5;
        --line: #493b4c;
        --accent: #f3f3f5;
      }
      body.light {
        color-scheme: light;
        --bg: #fcf7fa;
        --panel: white;
        --text: #33232e;
        --muted: #675966;
        --line: #dccfd5;
        --accent: #35343a;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.45 system-ui,
          sans-serif;
      }
      header,
      main {
        max-width: 1200px;
        margin: auto;
        padding: 18px clamp(16px, 4vw, 54px);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
      }
      main {
        padding-bottom: 160px;
      }
      .brand {
        font: italic bold 25px Georgia;
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      select,
      input[type="search"] {
        min-height: 44px;
        border: 1px solid var(--line);
        padding: 9px 14px;
        border-radius: 10px;
        background: var(--panel);
        color: var(--text);
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      :focus-visible {
        outline: none;
      }
      body.keyboard-navigation :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      dialog:focus {
        outline: none !important;
      }
      h1 {
        font:
          normal clamp(36px, 6vw, 72px) / 1.04 Georgia,
          serif;
        letter-spacing: -0.04em;
        margin: 10px 0 16px;
      }
      h2 {
        font-size: 22px;
        margin: 28px 0 12px;
      }
      p {
        margin: 8px 0;
      }
      .hero {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        min-height: 220px;
        display: flex;
        align-items: end;
        background: linear-gradient(115deg, #47243e, #a44b70);
        color: white;
        border-radius: 18px;
        padding: clamp(22px, 5vw, 60px);
      }
      .hero h1 {
        max-width: 70%;
        text-shadow: 0 2px 18px #382235;
      }
      .hero:after {
        content: "";
        position: absolute;
        z-index: -1;
        right: -3%;
        top: -20%;
        width: clamp(210px, 36vw, 420px);
        aspect-ratio: 1;
        border-radius: 50%;
        background:
          radial-gradient(
            circle,
            #432035 0 3%,
            #efa8c3 3.2% 16%,
            transparent 16.2%
          ),
          repeating-radial-gradient(circle, #321d2e 0 2px, #5c3e4c 3px 4px);
        box-shadow: -12px 12px 40px #351a2a80;
      }
      .tiles,
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
        gap: 15px;
      }
      .tile,
      .card {
        color: inherit;
        text-decoration: none;
        min-width: 0;
      }
      .tile {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 17px;
        display: grid;
        gap: 14px;
      }
      .tile i {
        color: var(--accent);
        font: normal 26px Georgia;
      }
      .tile strong,
      .card strong {
        display: block;
      }
      .tile:hover,
      .card:hover strong {
        color: var(--accent);
      }
      small,
      .meta,
      .status {
        color: var(--muted);
      }
      .status:empty {
        display: none;
      }
      .art {
        background: linear-gradient(135deg, #783f5d, #322137);
        border-radius: 12px;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
        font: italic 32px Georgia;
        color: #f2cddd;
      }
      .art.wide {
        aspect-ratio: 16/10;
      }
      .art img,
      .art video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .card strong {
        margin-top: 8px;
      }
      .crumb {
        display: inline-block;
        color: var(--accent);
        padding: 8px 0 16px;
      }
      .detail {
        display: grid;
        grid-template-columns: minmax(150px, 32%) 1fr;
        gap: 26px;
        align-items: center;
      }
      .row {
        width: 100%;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 12px;
        border-radius: 0;
        border-width: 0 0 1px;
        background: transparent;
        padding: 13px 4px;
      }
      .row span:first-child {
        color: var(--accent);
        min-width: 2em;
      }
      .row span:nth-child(2) {
        flex: 1;
      }
      .current {
        color: var(--accent);
        font-weight: 700;
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      #player {
        position: fixed;
        bottom: max(10px, env(safe-area-inset-bottom));
        right: max(12px, calc((100vw - 1120px) / 2));
        z-index: 3;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 10px 42px #0008;
        padding: 12px;
        width: min(490px, calc(100% - 24px));
        max-height: 75dvh;
        overflow: auto;
      }
      #player .tools {
        margin: 0;
      }
      #now {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      #panel {
        padding-top: 12px;
      }
      #panel audio,
      #film {
        width: 100%;
      }
      #film {
        max-height: 38dvh;
        background: black;
      }
      #playerArt {
        width: min(180px, 38vw);
        margin: auto;
      }
      button[aria-pressed="true"] {
        color: var(--accent);
      }
      dialog {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 16px;
        width: min(400px, 92vw);
      }
      dialog::backdrop {
        background: #0009;
      }
      dialog label {
        display: block;
        margin: 16px 0;
      }
      input[type="file"] {
        max-width: 100%;
      }
      @media (max-width: 640px) {
        header {
          padding-block: 12px;
        }
        .tiles,
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 12px;
        }
        .hero {
          min-height: 160px;
        }
        .hero:after {
          right: -17%;
        }
        .detail {
          grid-template-columns: 1fr;
          gap: 12px;
        }
        .detail .art {
          width: min(285px, 100%);
          margin: auto;
        }
      }

      body.video-detail {
        background: #100e15;
        color: #fff;
      }
      body.video-detail header {
        position: relative;
        z-index: 1;
        border-color: #ffffff22;
      }
      .video-detail .meta {
        color: #e7e0e7;
      }
      .video-detail .crumb {
        color: white;
      }
      #backdrop {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: #18131e;
      }
      #backdrop img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: right center;
      }
      #backdrop:after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            90deg,
            rgba(13, 10, 19, 0.93),
            rgba(13, 10, 19, 0.42) 62%,
            rgba(13, 10, 19, 0.12)
          ),
          linear-gradient(0deg, rgba(13, 10, 19, 0.9), transparent 65%);
      }
      .video-info {
        padding-top: clamp(30px, 10vh, 110px);
        min-height: 60vh;
        max-width: 620px;
      }
      .video-logo {
        display: block;
        max-width: min(360px, 85%);
        max-height: 160px;
        object-fit: contain;
        object-position: left;
        margin-bottom: 25px;
      }
      .description {
        font-size: 16px;
        line-height: 1.75;
        text-shadow: 0 1px 4px #000;
      }
      .video-info label {
        display: block;
        margin: 20px 0;
      }
      .primary {
        display: block;
        background: #f7f1f5;
        color: #221422;
        padding: 12px 30px;
        border: 0;
        margin-top: 25px;
        font-weight: 700;
      }
      .clip-rail {
        display: flex;
        overflow-x: auto;
        gap: 18px;
        scroll-snap-type: x mandatory;
        padding: 8px 2px 20px;
      }
      .clip-rail .card {
        flex: 0 0 240px;
        scroll-snap-align: start;
      }
      .rail-logo {
        display: block;
        height: 44px;
        max-width: 90%;
        object-fit: contain;
        object-position: left;
        margin-top: 12px;
      }
      .album-detail .detail {
        align-items: end;
        position: relative;
        display: block;
        padding: 0;
        isolation: isolate;
        min-height: 560px;
        border-radius: 18px;
        overflow: hidden;
        color: white;
      }
      .album-detail .album-scene {
        position: absolute;
        inset: 0;
        z-index: -2;
      }
      .album-detail .album-scene .art {
        width: 100%;
        height: 100%;
        border-radius: 0;
        background: #362739;
      }
      .album-detail .album-scene:after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          0deg,
          #17121b 0%,
          #17121b55 45%,
          transparent 80%
        );
      }
      .album-detail .detail > div:last-child {
        padding: 360px 24px 28px;
      }
      .album-detail .detail h1 {
        font-size: 42px;
      }
      .album-detail .detail .meta {
        color: #e2d4e0;
      }
      .album-detail .album-scene small {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 2;
      }
      .album-detail main {
        max-width: 900px;
      }
      #expanded {
        border: 0;
        margin: auto;
        width: min(500px, 100vw);
        max-width: 100vw;
        height: min(900px, 100dvh);
        max-height: 100dvh;
        padding: 20px 30px 30px;
        background: linear-gradient(155deg, #423242, #17141e 65%);
        color: white;
        overflow: auto;
      }
      #expanded::backdrop {
        background: #08060bd9;
        backdrop-filter: blur(20px);
      }
      #collapse {
        display: block;
        margin: 0 auto 14px;
        border: 0;
        background: transparent;
        color: #ddd;
        font-size: 30px;
        width: 70px;
      }
      #expanded #playerArt {
        width: 100%;
        max-width: 360px;
        margin: 0 auto 28px;
      }
      #expandedTitle {
        margin: 12px 0 2px;
        font-size: 24px;
      }
      #expandedArtist {
        color: #c8bfcd;
        margin: 0 0 24px;
      }
      #expanded .timeline input {
        width: 100%;
        accent-color: white;
        min-height: 24px;
      }
      #expanded .timeline > div {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #c8bfcd;
      }
      .transport {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 24px;
      }
      .transport button {
        border: 0;
        background: transparent;
        color: white;
        padding: 8px;
        font-size: 23px;
      }
      .transport #bigPlay {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background: white;
        color: #19141e;
        font-size: 30px;
      }
      .transport #repeatButton {
        font-size: 15px;
      }
      .transport button[aria-pressed="true"] {
        color: #ffffff;
      }
      .volume {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 26px;
        font-size: 13px;
        color: #c8bfcd;
      }
      .volume input {
        accent-color: white;
      }
      #expanded.video-player {
        width: min(1100px, 100vw);
        height: auto;
      }
      .video-player #film {
        max-height: 70dvh;
      }
      .video-player .timeline,
      .video-player .transport,
      .video-player .volume {
        display: none;
      }
      @media (max-width: 640px) {
        #backdrop img {
          width: 125%;
          height: auto;
          max-width: none;
          transform: translateX(-20%);
          object-fit: contain;
          object-position: right top;
        }
        #backdrop:after {
          background: linear-gradient(
            0deg,
            #100e15e8 3%,
            #100e15a8 65%,
            #100e1520
          );
        }
        .video-info {
          padding-top: 22vh;
          min-height: 68vh;
        }
        .video-logo {
          max-height: 110px;
          max-width: 80%;
        }
        .clip-rail .card {
          flex-basis: 190px;
        }
        .album-detail main {
          padding-left: 0;
          padding-right: 0;
        }
        .album-detail .crumb,
        .album-detail main > h2,
        .album-detail main > .row,
        .album-detail main > h3 {
          margin-left: 16px;
          margin-right: 16px;
        }
        .album-detail main > .row {
          width: calc(100% - 32px);
        }
        .album-detail .detail {
          border-radius: 0;
          min-height: 68vh;
        }
        .album-detail .detail > div:last-child {
          padding-top: 48vh;
        }
        #expanded {
          height: 100dvh;
          width: 100vw;
          border-radius: 0;
          padding: max(16px, env(safe-area-inset-top)) 25px
            max(25px, env(safe-area-inset-bottom));
        }
        #expanded.video-player {
          height: 100dvh;
          display: flex;
          flex-direction: column;
          justify-content: center;
        }
        #expanded.video-player:not([open]) {
          display: none;
        }
      }
      .skip {
        display: inline-block;
        width: 24px;
        height: 24px;
        background: currentColor;
        clip-path: polygon(
          0 0,
          80% 50%,
          0 100%,
          0 0,
          85% 0,
          100% 0,
          100% 100%,
          85% 100%,
          85% 0
        );
      }
      .skip.previous {
        transform: rotate(180deg);
      }
      body {
        padding-top: 52px;
      }
      #topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 52px;
        max-width: none;
        margin: 0;
        padding: 0 16px;
        display: grid;
        grid-template-columns: 44px 1fr 44px;
        z-index: 20;
        background: rgba(25, 22, 31, 0.78);
        border-bottom: 1px solid #ffffff15;
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
      }
      #topbar .brand {
        grid-column: 2;
        text-align: center;
        font:
          600 19px system-ui,
          sans-serif;
        letter-spacing: -0.4px;
        color: white;
      }
      #menuButton {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        width: 44px;
        height: 44px;
        padding: 10px;
        background: none;
        border: 0;
      }
      #menuButton span {
        height: 2px;
        width: 23px;
        background: white;
        border-radius: 2px;
      }
      #navigation {
        inset: 0;
        margin: 0;
        width: 100vw;
        max-width: 100vw;
        height: 100dvh;
        max-height: 100dvh;
        border: 0;
        border-radius: 0;
        padding: 0 24px 40px;
        background: rgba(24, 21, 31, 0.72);
        backdrop-filter: blur(32px);
        -webkit-backdrop-filter: blur(32px);
        color: white;
      }
      #navigation::backdrop {
        background: rgba(10, 8, 15, 0.3);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
      }
      .menu-header {
        display: grid;
        grid-template-columns: 44px 1fr 44px;
        align-items: center;
        height: 52px;
        margin: 0 -8px;
      }
      .menu-header span {
        text-align: center;
        font-size: 19px;
        font-weight: 600;
      }
      #closeNavigation {
        border: 0;
        background: none;
        color: white;
        font-size: 32px;
        padding: 0;
      }
      #navigation nav {
        max-width: 650px;
        margin: 28px auto;
      }
      #navigation nav a {
        display: block;
        font-size: 26px;
        color: white;
        text-decoration: none;
        padding: 17px 0;
        border-bottom: 1px solid #ffffff20;
        font-weight: 500;
      }
      #navigation #optionsBtn {
        display: block;
        margin: 35px auto;
        background: #ffffff16;
        border-color: #ffffff30;
        color: white;
      }
      #player {
        position: fixed;
        bottom: max(10px, env(safe-area-inset-bottom));
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        width: min(680px, calc(100% - 24px));
        padding: 6px 10px;
        border-radius: 18px;
        background: rgba(35, 32, 44, 0.83);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid #ffffff30;
        color: white;
        box-shadow: 0 6px 28px #0004;
        z-index: 25;
        max-height: 180px;
      }
      .compact-player {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #expand {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        text-align: left;
        background: none;
        border: 0;
        color: white;
        padding: 0;
      }
      #miniCover,
      #miniPlaceholder {
        width: 42px;
        height: 42px;
        flex: none;
        object-fit: cover;
        border-radius: 7px;
        background: #ffffff22;
      }
      #miniPlaceholder {
        display: grid;
        place-items: center;
        font-size: 25px;
      }
      .mini-meta {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      #now {
        font-size: 14px;
        font-weight: 600;
        display: block;
      }
      #miniArtist {
        font-size: 11px;
        color: #c6bdce;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #player #toggle,
      #miniNext {
        width: 40px;
        height: 44px;
        padding: 5px;
        background: none;
        border: 0;
        color: white;
        font:
          25px Arial,
          sans-serif;
        flex: none;
      }
      #miniNext .skip {
        width: 19px;
        height: 19px;
      }
      #player #problem {
        font-size: 12px;
        margin: 3px;
      }
      body.album-detail {
        --album-color: rgb(32, 30, 45);
        --album-rgb: 32, 30, 45;
        background: var(--album-color);
        color: white;
      }
      .album-detail #topbar {
        background: rgba(var(--album-rgb), 0.8);
      }
      .album-detail main {
        position: relative;
        z-index: 1;
      }
      .album-detail .detail {
        overflow: hidden;
        isolation: isolate;
      }
      .album-detail .album-scene {
        will-change: transform, filter;
        transform-origin: center top;
      }
      .album-detail .album-scene:after {
        background: linear-gradient(
          0deg,
          var(--album-color),
          rgba(var(--album-rgb), 0.1) 75%,
          transparent
        );
      }
      .album-detail .detail > div:last-child {
        text-align: center;
        background: linear-gradient(0deg, var(--album-color), transparent);
        position: relative;
      }
      .album-detail .detail h1 {
        font:
          700 27px/1.18 system-ui,
          sans-serif;
        letter-spacing: -0.5px;
      }
      .album-detail .detail > div:last-child > button {
        background: white;
        color: var(--album-color);
        border: 0;
        border-radius: 24px;
        min-width: 145px;
        font-weight: 600;
        margin-top: 12px;
      }
      .album-detail .row {
        color: white;
        border-color: #ffffff22;
      }
      .album-detail .row span:first-child {
        color: #c7d5e2;
      }
      .album-detail .meta,
      .album-detail small {
        color: #e3dfeb;
      }
      #albumWash {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
        background: var(--album-color);
        opacity: 0;
      }
      #albumWash img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: blur(100px) saturate(1.4);
        transform: scale(1.3);
        opacity: 0.22;
      }
      .playlist-grid {
        margin-top: 24px;
      }
      #playlistEditor,
      #trackPicker {
        width: min(650px, calc(100% - 24px));
        max-height: 85dvh;
        overflow: auto;
      }
      #playlistName {
        display: block;
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--line);
        color: var(--text);
        padding: 12px;
        border-radius: 8px;
        margin: 12px 0;
      }
      #trackPicker > .tools {
        position: sticky;
        top: -16px;
        background: var(--panel);
        padding: 12px 0;
        justify-content: space-between;
        z-index: 1;
      }
      #trackPicker h2 {
        margin: 0;
        font-size: 19px;
      }
      #pickerSearch {
        width: 100%;
      }
      .picker-row {
        display: flex;
        gap: 12px;
        align-items: center;
        border-bottom: 1px solid var(--line);

          localStorage.setItem("theme", e.target.checked ? "light" : "dark");
        } catch {}
      };
      async function load(file) {
        const g = ++loadVersion;
        try {
          let raw,
            base = new URL(".", location.href).href;
          if (file) raw = JSON.parse(await file.text());
          else {
            const r = await fetch(
              "https://zayandoux.github.io/britneyspears/catalogo.json",
              { cache: "no-cache" },
            );
            if (!r.ok) throw Error("HTTP " + r.status);
            raw = await r.json();
            base = new URL(".", r.url).href;
          }
          const parsed = normalize(raw, base);
          if (g !== loadVersion) return;
          library = parsed.result;
          names = parsed.names;
          message = Object.values(library).some((a) => a.length)
            ? ""
            : "Nenhuma coleção reconhecida neste JSON.";
          if (file) {
            expand(false);
            ++playVersion;
            release(media);
            queue = [];
            renderPlayerArt();
            $("#player").hidden = true;
            location.hash = "";
          }
        } catch (e) {
          if (g !== loadVersion) return;
          message =
            "Não foi possível abrir o catálogo. Use Opções → Abrir catálogo JSON. " +
            (file ? e.message : "");
        }
        draw();
      }
      $("#file").onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
          $("#settingsDialog").close();
          load(file);
        }
        e.target.value = "";
      };
      if ("mediaSession" in navigator) {
        for (const [action, handler] of Object.entries({
          play: () => media.play().catch((e) => reportError(e.message)),
          pause: () => media.pause(),
          nexttrack: () => next(false),
          previoustrack: () =>
            play(queue, (idx + queue.length - 1) % queue.length),
        })) {
          try {
            navigator.mediaSession.setActionHandler(action, handler);
          } catch {}
        }
      }
      $("#collapse").onclick = () => expand(false);
      $("#expanded").addEventListener("close", () => {
        playerCleanup();
        $("#expand").setAttribute("aria-expanded", "false");
      });
      $("#bigPlay").onclick = () => $("#toggle").click();
      $("#repeatButton").onclick = () => {
        const select = $("#repeat");
        select.selectedIndex = (select.selectedIndex + 1) % 4;
        $("#repeatButton").textContent = ["Off", "1", "↻", "D"][
          select.selectedIndex
        ];
        $("#repeatButton").setAttribute(
          "aria-label",
          select.options[select.selectedIndex].text,
        );
        $("#repeatButton").setAttribute(
          "aria-pressed",
          String(select.selectedIndex !== 0),
        );
      };
      function formatTime(seconds) {
        if (!Number.isFinite(seconds)) return "0:00";
        return (
          Math.floor(seconds / 60) +
          ":" +
          String(Math.floor(seconds % 60)).padStart(2, "0")
        );
      }
      for (const v of [$("audio"), $("#film")])
        v.addEventListener("timeupdate", () => {
          if (v !== media) return;
          $("#seek").disabled = !Number.isFinite(v.duration);
          $("#seek").value = v.duration
            ? (v.currentTime / v.duration) * 1000
            : 0;
          $("#elapsed").textContent = formatTime(v.currentTime);
          $("#remaining").textContent =
            "−" + formatTime(v.duration - v.currentTime);
        });
      $("#seek").oninput = (e) => {
        if (Number.isFinite(media.duration))
          media.currentTime = (media.duration * Number(e.target.value)) / 1000;
      };
      $("#volume").oninput = (e) => {
        for (const v of [$("audio"), $("#film")])
          v.volume = Number(e.target.value);
      };
      let gestureY;
      $("#collapse").addEventListener(
        "touchstart",
        (e) => (gestureY = e.touches[0].clientY),
        { passive: true },
      );
      $("#collapse").addEventListener(
        "touchend",
        (e) => {
          if (e.changedTouches[0].clientY - gestureY > 45) expand(false);
        },
        { passive: true },
      );
      function reportError(message) {
        $("#problem").textContent = message;
        $("#expandedProblem").textContent = message;
      }
      let subtitleUrls = [];
      async function loadSubtitles(track, g) {
        $("#film")
          .querySelectorAll("track")
          .forEach((t) => t.remove());
        subtitleUrls.forEach(URL.revokeObjectURL);
        subtitleUrls = [];
        for (const sub of track.subtitles || []) {
          try {
            const src = url(
              sub.subtitlePath || sub.url,
              "https://zayandoux.github.io/britneyspears/",
            );
            const response = await fetch(src);
            if (!response.ok) throw Error();
            let text = await response.text();
            if (g !== playVersion) return;
            if (!text.trimStart().startsWith("WEBVTT"))
              text =
                "WEBVTT\n\n" +
                text
                  .replace(/^\uFEFF/, "")
                  .replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, "$1.$2");
            const blob = URL.createObjectURL(
              new Blob([text], { type: "text/vtt" }),
            );
            subtitleUrls.push(blob);
            const node = el("track");
            node.kind = "subtitles";
            node.label = sub.label || "Legenda";
            node.srclang = sub.language || "pt";
            node.src = blob;
            $("#film").append(node);
          } catch {
            if (g === playVersion)
              reportError(
                "Uma legenda está indisponível. Você pode continuar assistindo.",
              );
          }
        }
      }
      document.addEventListener("keydown", (e) => {
        if (
          e.code === "Space" &&
          !e.target.closest("button,input,select,textarea,a,video") &&
          queue.length
        ) {
          e.preventDefault();
          $("#toggle").click();
        }
      });
      window.onhashchange = () => {
        closeMenu();
        if (!!$("#expanded").open) expand(false);
        draw();
        window.scrollTo(0, 0);
      };
      const playlistKey = "britney.personalPlaylists.v1";
      let albumScrollCleanup = () => {};
      let editingPlaylistId = null;
      let pickerPlaylistId = null;

      let menuAnimation = null;
      let menuTransition = 0;
      async function setMenuOpen(open) {
        const dialog = $("#navigation");
        if (!open && !dialog.open) return;
        const transition = ++menuTransition;
        const from = dialog.open
          ? getComputedStyle(dialog).clipPath
          : "inset(0 0 100% 0)";
        menuAnimation?.cancel();
        if (open && !dialog.open) {
          dialog.showModal();
          dialog.focus({ preventScroll: true });
        }
        document.body.classList.add("menu-open");
        document.body.classList.toggle("menu-blur", open);
        dialog.classList.toggle("menu-visible", open);
        $("#menuButton").setAttribute("aria-expanded", String(open));
        const duration = matchMedia("(prefers-reduced-motion: reduce)").matches
          ? 1
          : 560;
        menuAnimation = dialog.animate(
          [
            { clipPath: from === "none" ? "inset(0 0 0% 0)" : from },
            { clipPath: open ? "inset(0 0 0% 0)" : "inset(0 0 100% 0)" },
          ],
          { duration, easing: "cubic-bezier(.22,.61,.36,1)", fill: "forwards" },
        );
        try {
          await menuAnimation.finished;
        } catch {
          return;
        }
        if (transition !== menuTransition) return;
        if (!open) {
          dialog.close();
          document.body.classList.remove("menu-open", "menu-blur");
        }
        menuAnimation.cancel();
        menuAnimation = null;
      }
      function closeMenu() {
        return setMenuOpen(false);
      }
      $("#menuButton").onclick = () => setMenuOpen(true);
      $("#navigation").addEventListener("cancel", (event) => {
        event.preventDefault();
        closeMenu();
      });
      $("#navigation").addEventListener("close", () => {
        if (!$("#navigation").open) {
          document.body.classList.remove("menu-open", "menu-blur");
          $("#menuButton").setAttribute("aria-expanded", "false");
        }
      });
      $("#closeNavigation").onclick = closeMenu;
      $("#navigation nav").onclick = async (event) => {
        const link = event.target.closest("a");
        if (!link) return;
        event.preventDefault();
        await closeMenu();
        location.hash = link.hash || "#";
      };
      document.addEventListener("keydown", (event) => {
        if (event.key === "Tab" || event.key.startsWith("Arrow"))
          document.body.classList.add("keyboard-navigation");
      });
      document.addEventListener(
        "pointerdown",
        () => document.body.classList.remove("keyboard-navigation"),
        { passive: true },
      );
      $("#miniNext").onclick = () => next(false);
      $("#miniCover").onerror = () => {
        $("#miniCover").hidden = true;
        $("#miniPlaceholder").hidden = false;
      };

      const albumPalette = {
        "baby-one-more-time": "4c3a3d",
        "oops-i-did-it-again": "382410",
        britney: "0b3666",
        "in-the-zone": "0b3e58",
        blackout: "604a44",
        circus: "0a0d0d",
        "femme-fatale": "f7f4ef",
        "britney-jean": "020101",
        glory: "65543b",
        oops25th: "1e1816",
        britney25th: "2b5f97",
      };
      function setupAlbumScroll(item, head, visual) {
        let active = true;
        let frame = 0;
        let start = 0;
        let height = 1;
        const wash = el("div");
        wash.id = "albumWash";
        if (item.cover) {
          const image = el("img");
          image.src = item.cover;
          image.alt = "";
          wash.append(image);
        }
        document.body.prepend(wash);
        const reducedMotion = matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        function update() {
          frame = 0;
          const scroll = Math.max(0, window.scrollY - start);
          const progress = Math.min(1, scroll / Math.max(height * 0.75, 1));
          visual.style.transform = reducedMotion
            ? "none"
            : "translateY(" + Math.min(scroll * 0.4, height * 0.8) + "px)";
          visual.style.filter = "blur(" + progress * 42 + "px)";
          visual.style.opacity = String(1 - progress * 0.72);
          wash.style.opacity = String(progress);
        }
        function measure() {
          const video = visual.querySelector("video");
          const ratio =
            video?.videoWidth && video?.videoHeight
              ? video.videoWidth / video.videoHeight
              : item.tall
                ? 3 / 4
                : 1;
          head.style.setProperty(
            "--art-height",
            head.clientWidth / ratio + "px",
          );
          start = head.getBoundingClientRect().top + window.scrollY - 52;
          height = head.offsetHeight;
          update();
        }
        function scroll() {
          if (!frame) frame = requestAnimationFrame(update);
        }
        window.addEventListener("scroll", scroll, { passive: true });
        window.addEventListener("resize", measure);
        const artVideo = visual.querySelector("video");
        artVideo?.addEventListener("loadedmetadata", measure);
        measure();
        const preset = albumPalette[item.id];
        if (preset) {
          const source = [0, 2, 4].map((i) =>
            parseInt(preset.slice(i, i + 2), 16),
          );
          const brightness = Math.min(0.65, 95 / Math.max(...source, 1));
          const rgb = source.map((channel) => Math.round(channel * brightness));
          document.body.style.setProperty("--album-rgb", rgb.join(","));
          document.body.style.setProperty(
            "--album-color",
            "rgb(" + rgb.join(",") + ")",
          );
        }
        if (item.cover && !preset) {
          const image = new Image();
          image.crossOrigin = "anonymous";
          image.onload = () => {
            if (!active) return;
            try {
              const canvas = document.createElement("canvas");
              canvas.width = canvas.height = 24;
              const context = canvas.getContext("2d", {
                willReadFrequently: true,
              });
              context.drawImage(image, 0, 0, 24, 24);
              const pixels = context.getImageData(0, 0, 24, 24).data;
              const colors = new Map();
              for (let i = 0; i < pixels.length; i += 4) {
                const rgb = [pixels[i], pixels[i + 1], pixels[i + 2]];
                const high = Math.max(...rgb),
                  low = Math.min(...rgb);
                if (high < 35 || low > 225) continue;
                const key = rgb.map((v) => Math.floor(v / 40)).join("-");
                const color = colors.get(key) || { weight: 0, sum: [0, 0, 0] };
                const weight = 1 + (high - low) / 60;
                color.weight += weight;
                rgb.forEach((v, j) => (color.sum[j] += v * weight));
                colors.set(key, color);
              }
              const color = [...colors.values()].sort(
                (a, b) => b.weight - a.weight,
              )[0];
              if (color) {
                const rgb = color.sum.map((v) =>
                  Math.round((v / color.weight) * 0.42),
                );
                document.body.style.setProperty("--album-rgb", rgb.join(","));
                document.body.style.setProperty(
                  "--album-color",
                  "rgb(" + rgb.join(",") + ")",
                );
              }
            } catch {}
          };
          image.src = item.cover;
        }
        albumScrollCleanup = () => {
          active = false;
          cancelAnimationFrame(frame);
          window.removeEventListener("scroll", scroll);
          window.removeEventListener("resize", measure);
          artVideo?.removeEventListener("loadedmetadata", measure);
          wash.remove();
        };
      }

      function readPlaylists() {
        const lists = JSON.parse(localStorage.getItem(playlistKey) || "[]");
        if (
          !Array.isArray(lists) ||
          lists.some(
            (p) =>
              !p ||
              typeof p.id !== "string" ||
              typeof p.name !== "string" ||
              !Array.isArray(p.tracks),
          )
        ) {
          throw Error("As playlists salvas não puderam ser lidas.");
        }
        return lists;
      }
      async function changePlaylists(change) {
        const save = () => {
          const lists = readPlaylists();
          const result = change(lists);
          localStorage.setItem(playlistKey, JSON.stringify(lists));
          return result;
        };
        if (navigator.locks) return navigator.locks.request(playlistKey, save);
        return save();
      }
      function playlistCount() {
        try {
          return readPlaylists().length + (library.playlists?.length || 0);
        } catch {
          return library.playlists?.length || 0;
        }
      }
      function availableTracks() {
        const tracks = [];
        for (const kind of ["musicas", "videoclipes", "shows", "especiais"]) {
          for (const item of library[kind] || []) {
            for (const version of [item, ...(item.variants || [])]) {
              for (const track of version.tracks || [])
                if (track.src) tracks.push(track);
            }
          }
        }
        return [...new Map(tracks.map((t) => [t.src, t])).values()];
      }
      function snapshot(track) {
        return {
          src: track.src,
          title: track.title,
          artist: track.artist,
          duration: track.duration,
          video: !!track.video,
          subtitles: track.subtitles || [],
          album: {
            id: track.album?.id,
            title: track.album?.title,
            artist: track.album?.artist || "Britney Spears",
            cover: track.album?.cover || "",
            anim: track.album?.anim || "",
            backup: track.album?.backup || "",
          },
        };
      }
      function resolveTracks(saved) {
        const current = new Map(availableTracks().map((t) => [t.src, t]));
        return saved
          .filter((t) => t && url(t.src, location.href))
          .map(
            (t) =>
              current.get(t.src) || {
                ...t,
                album: t.album || { artist: "Britney Spears" },
              },
          );
      }
      function openPlaylistEditor(playlist = null) {
        editingPlaylistId = playlist?.id || null;
        $("#playlistHeading").textContent = playlist
          ? "Renomear playlist"
          : "Criar playlist";
        $("#playlistName").value = playlist?.name || "";
        $("#playlistError").textContent = "";
        $("#playlistEditor").showModal();
        $("#playlistName").focus();
      }
      $("#cancelPlaylist").onclick = () => $("#playlistEditor").close();
      $("#playlistForm").onsubmit = async (event) => {
        event.preventDefault();
        const name = $("#playlistName").value.trim();
        if (!name) {
          $("#playlistError").textContent = "Digite um nome para a playlist.";
          return;
        }
        const button = event.submitter;
        button.disabled = true;
        try {
          const id = await changePlaylists((lists) => {
            if (editingPlaylistId) {
              const list = lists.find((p) => p.id === editingPlaylistId);
              if (!list) throw Error("Playlist não encontrada.");
              list.name = name;
              return list.id;
            }
            const id =
              globalThis.crypto?.randomUUID?.() ||
              Date.now() + "-" + Math.random().toString(36).slice(2);
            lists.push({ id, name, tracks: [] });
            return id;
          });
          $("#playlistEditor").close();
          const route = "#playlists/local/" + id;
          if (location.hash === route) draw();
          else location.hash = route;
        } catch (error) {
          $("#playlistError").textContent =
            "Não foi possível salvar. " + error.message;
        } finally {
          button.disabled = false;
        }
      };
      function openPicker(id) {
        pickerPlaylistId = id;
        $("#pickerSearch").value = "";
        $("#pickerStatus").textContent = "";
        renderPicker();
        $("#trackPicker").showModal();
      }
      function renderPicker() {
        const container = $("#pickerResults");
        container.replaceChildren();
        try {
          const playlist = readPlaylists().find(
            (p) => p.id === pickerPlaylistId,
          );
          if (!playlist) {
            $("#pickerStatus").textContent = "Playlist não encontrada.";
            return;
          }
          const selected = new Set(playlist.tracks.map((t) => t.src));
          const query = norm($("#pickerSearch").value);
          const tracks = availableTracks().filter((t) =>
            norm(t.title + " " + t.album?.title).includes(query),
          );
          if (!tracks.length)
            container.append(el("p", "Nenhum item encontrado."));
          for (const track of tracks) {
            const row = el("div", null, "picker-row"),
              text = el("div");
            text.append(
              el("strong", track.title),
              el("small", track.album?.title || track.artist),
            );
            const button = el(
              "button",
              selected.has(track.src) ? "Adicionado" : "Adicionar",
            );
            button.disabled = selected.has(track.src);
            button.setAttribute(
              "aria-label",
              (button.disabled ? "Adicionado " : "Adicionar ") + track.title,
            );
            button.onclick = async () => {
              button.disabled = true;
              try {
                await changePlaylists((lists) => {
                  const list = lists.find((p) => p.id === pickerPlaylistId);
                  if (!list) throw Error("Playlist não encontrada.");
                  if (!list.tracks.some((t) => t.src === track.src))
                    list.tracks.push(snapshot(track));
                });
                button.textContent = "Adicionado";
                $("#pickerStatus").textContent = track.title + " adicionado.";
              } catch (error) {
                button.disabled = false;
                $("#pickerStatus").textContent =
                  "Não foi possível salvar. " + error.message;
              }
            };
            row.append(text, button);
            container.append(row);
          }
        } catch (error) {
          $("#pickerStatus").textContent = error.message;
        }
      }
      $("#pickerSearch").oninput = renderPicker;
      $("#closePicker").onclick = () => {
        $("#trackPicker").close();
        draw();
      };
      $("#trackPicker").addEventListener("cancel", () =>
        requestAnimationFrame(draw),
      );
      function renderPlaylists(main, id, version) {
        main.append(
          link(
            id ? "‹ Playlists" : "‹ Início",
            id ? "#playlists" : "#",
            "crumb",
          ),
        );
        let personal;
        try {
          personal = readPlaylists();
        } catch (error) {
          main.append(
            el("h1", "Playlists"),
            el(
              "p",
              error.message +
                " O navegador precisa permitir o armazenamento local.",
            ),
          );
          return;
        }
        if (id === undefined) {
          main.append(el("h1", "Playlists"));
          const create = el("button", "+ Criar playlist");
          create.onclick = () => openPlaylistEditor();
          main.append(create);
          if (!personal.length)
            main.append(
              el(
                "p",
                "Crie uma playlist e adicione suas músicas e vídeos.",
                "meta",
              ),
            );
          const grid = el("div", null, "grid playlist-grid");
          main.append(grid);
          for (const list of personal) {
            const a = link("", "#playlists/local/" + list.id, "card");
            a.append(
              art({ cover: list.tracks[0]?.album?.cover }),
              el("strong", list.name),
              el("small", list.tracks.length + " itens"),
            );
            grid.append(a);
          }
          if (library.playlists?.length) {
            main.append(el("h2", "Do catálogo"));
            const grid = el("div", null, "grid");
            main.append(grid);
            library.playlists.forEach((list, i) => {
              const a = link("", "#playlists/" + i, "card");
              a.append(art(list), el("strong", list.title));
              grid.append(a);
            });
          }
          return;
        }
        const personalList =
          id === "local" ? personal.find((p) => p.id === version) : null;
        const catalogList = /^\d+$/.test(id)
          ? library.playlists?.[Number(id)]
          : null;
        if (!personalList && !catalogList) {
          main.append(el("p", "Playlist não encontrada."));
          return;
        }
        const tracks = personalList
          ? resolveTracks(personalList.tracks)
          : catalogList.tracks.filter((t) => t.src);
        main.append(
          el("h1", personalList?.name || catalogList.title),
          el("p", tracks.length + " itens", "meta"),
        );
        const controls = el("div", null, "tools");
        main.append(controls);
        const playButton = el("button", "Reproduzir");
        playButton.disabled = !tracks.length;
        playButton.onclick = () => play(tracks, 0);
        controls.append(playButton);
        if (personalList) {
          const add = el("button", "Adicionar músicas e vídeos");
          add.onclick = () => openPicker(personalList.id);
          const rename = el("button", "Renomear");
          rename.onclick = () => openPlaylistEditor(personalList);
          controls.append(add, rename);
        }
        const feedback = el("p", null, "status");
        feedback.setAttribute("role", "status");
        main.append(feedback);
        tracks.forEach((track, i) => {
          const wrapper = el("div", null, "playlist-track"),
            row = el("button", null, "row");
          row.entry = track;
          row.append(
            el("span", i + 1),
            el("span", track.title),
            el("small", track.duration || ""),
          );
          row.onclick = () => play(tracks, i);
          wrapper.append(row);
          if (personalList) {
            const remove = el("button", "×");
            remove.setAttribute("aria-label", "Remover " + track.title);
            remove.onclick = async () => {
              remove.disabled = true;
              try {
                await changePlaylists((lists) => {
                  const list = lists.find((p) => p.id === personalList.id);
                  if (!list) throw Error("Playlist não encontrada.");
                  list.tracks = list.tracks.filter((t) => t.src !== track.src);
                });
                draw();
              } catch (error) {
                remove.disabled = false;
                feedback.textContent =
                  "Não foi possível salvar. " + error.message;
              }
            };
            wrapper.append(remove);
          }
          main.append(wrapper);
        });
        highlight();
      }
      window.addEventListener("storage", (event) => {
        if (event.key !== playlistKey) return;
        if ($("#trackPicker").open) renderPicker();
        if (
          location.hash.startsWith("#playlists") ||
          !location.hash ||
          location.hash === "#"
        )
          draw();
      });
      draw();
      load();
    </script>
  </body>
